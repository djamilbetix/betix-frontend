<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Betix - Test Paiement Pi</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f5f5f5; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; background: #3B82F6; color: white; border: none; border-radius: 8px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 10px; background: white; border-radius: 8px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .ticket { background: #e0f7fa; padding: 15px; margin: 10px auto; max-width: 400px; border-radius: 8px; }
        h1 { color: #1e3a8a; }
    </style>
</head>
<body>

<h1>🎫 Betix - Test Pi Network</h1>

<button id="connectBtn">🔌 Connexion wallet Pi</button>
<button id="buyBtn" style="display:none;">💳 Acheter un ticket (0.0003 Pi)</button>

<div id="status">⏳ En attente...</div>
<div id="tickets"></div>

<script>
    const BACKEND_URL = "https://betix-backend.onrender.com";
    let piUser = null;
    let tickets = JSON.parse(localStorage.getItem('betix_tickets_test')) || [];

    function afficherTickets() {
        const div = document.getElementById('tickets');
        if (tickets.length === 0) {
            div.innerHTML = '<p>Aucun ticket pour le moment</p>';
            return;
        }
        div.innerHTML = '<h3>🎟️ Mes tickets :</h3>' + tickets.map(t => `<div class="ticket">✅ ${t.title} - ${t.date}</div>`).join('');
    }

    async function connecterWallet() {
        if (typeof Pi === 'undefined') {
            document.getElementById('status').innerHTML = '❌ Veuillez ouvrir dans Pi Browser';
            return;
        }
        try {
            Pi.init({ version: "2.0", sandbox: true });
            const auth = await Pi.authenticate(['username', 'payments'], null);
            if (auth && auth.user) {
                piUser = auth.user;
                document.getElementById('status').innerHTML = `✅ Connecté en tant que : ${piUser.username}`;
                document.getElementById('buyBtn').style.display = 'inline-block';
                document.getElementById('connectBtn').disabled = true;
            }
        } catch(e) {
            document.getElementById('status').innerHTML = '❌ Erreur: ' + e.message;
        }
    }

    async function acheterTicket() {
        if (!piUser) {
            alert("Connectez d'abord votre wallet");
            return;
        }
        
        document.getElementById('status').innerHTML = '⏳ Création du paiement...';
        
        try {
            const payment = await Pi.createPayment({
                amount: 0.0003,
                memo: "Ticket test Betix",
                metadata: { product: "ticket", price: 0.0003 }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    document.getElementById('status').innerHTML = '📝 Approbation en cours...';
                    fetch(`${BACKEND_URL}/api/pi/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId })
                    }).then(() => Pi.approvePayment(paymentId));
                },
                
                onReadyForServerCompletion: function(paymentId, txid) {
                    document.getElementById('status').innerHTML = '💰 Finalisation...';
                    fetch(`${BACKEND_URL}/api/pi/complete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId, txid })
                    }).then(() => Pi.completePayment(paymentId, txid));
                },
                
                onCancel: function() {
                    document.getElementById('status').innerHTML = '❌ Paiement annulé';
                },
                
                onError: function(error) {
                    document.getElementById('status').innerHTML = '❌ Erreur: ' + error.message;
                }
            });
            
            // Ajout du ticket
            setTimeout(() => {
                tickets.push({ title: "Ticket de test", date: new Date().toLocaleString() });
                localStorage.setItem('betix_tickets_test', JSON.stringify(tickets));
                afficherTickets();
                document.getElementById('status').innerHTML = '✅ Ticket acheté avec succès !';
            }, 2000);
            
        } catch(e) {
            document.getElementById('status').innerHTML = '❌ Erreur: ' + e.message;
        }
    }

    document.getElementById('connectBtn').onclick = connecterWallet;
    document.getElementById('buyBtn').onclick = acheterTicket;
    
    afficherTickets();
</script>

</body>
</html>
