<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scanner un billet - Betix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #131a2e;
            border-radius: 24px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #1e2a44;
            position: relative;
        }
        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 span {
            background: linear-gradient(135deg, #1a73e8, #4fc3f7);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
        }
        .subtitle {
            text-align: center;
            color: #8892b0;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 400px;
            margin: 0 auto 20px;
            background: #0d1424;
            border-radius: 16px;
            overflow: hidden;
            border: 2px dashed #2a3a5e;
            position: relative;
        }
        #reader video {
            border-radius: 14px;
        }
        #result {
            margin-top: 16px;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1424;
            border: 1px solid #1e2a44;
            color: #8892b0;
            transition: all 0.3s;
        }
        #result.success {
            background: #0a2e1a;
            border-color: #10b981;
            color: #6ee7b7;
        }
        #result.error {
            background: #2e0a0a;
            border-color: #ef4444;
            color: #fca5a5;
        }
        #result.loading {
            background: #1a1a2e;
            border-color: #f59e0b;
            color: #fcd34d;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            min-width: 120px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 115, 232, 0.4);
        }
        .btn-secondary {
            background: #1e2a44;
            color: #8892b0;
        }
        .btn-secondary:hover {
            background: #2a3a5e;
        }
        .btn-danger {
            background: #2e0a0a;
            color: #fca5a5;
            border: 1px solid #ef4444;
        }
        .btn-danger:hover {
            background: #3f0f0f;
        }

        /* ============================================================
           TICKET INFO CARD (AGGRANDIE)
           ============================================================ */
        .ticket-info {
            margin-top: 20px;
            padding: 20px 24px;
            background: linear-gradient(145deg, #1a2438, #0f1a2e);
            border-radius: 20px;
            border: 1px solid #2a3a5e;
            text-align: left;
            font-size: 1rem;
            color: #ccd6f6;
            display: none;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            transform: scale(0.95);
            opacity: 0;
        }
        .ticket-info.show {
            display: block;
            transform: scale(1);
            opacity: 1;
        }
        .ticket-info .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a2a44;
        }
        .ticket-info .row:last-child {
            border-bottom: none;
        }
        .ticket-info .label {
            color: #8892b0;
            font-weight: 400;
            font-size: 0.85rem;
        }
        .ticket-info .value {
            font-weight: 600;
            color: #fff;
            text-align: right;
            max-width: 65%;
            word-break: break-all;
            font-size: 1rem;
        }
        .ticket-info .value-highlight {
            color: #4fc3f7;
            font-size: 1.1rem;
        }
        .ticket-info .purchase-date {
            color: #6ee7b7;
            font-size: 0.85rem;
        }

        /* ============================================================
           VALIDATION OVERLAY (ANIMATION SUCCES)
           ============================================================ */
        #validationOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            animation: fadeInOverlay 0.3s ease;
        }
        #validationOverlay.active {
            display: flex;
        }

        .validation-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseCircle 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            border: 4px solid #10b981;
            box-shadow: 0 0 60px rgba(16, 185, 129, 0.3);
        }
        .validation-circle .check {
            font-size: 5rem;
            color: #10b981;
            animation: popCheck 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            opacity: 0;
            transform: scale(0);
        }

        /* Particules / Confettis */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10000;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulseCircle {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes popCheck {
            0% { opacity: 0; transform: scale(0) rotate(-30deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* ============================================================
           OVERLAY SCANNER
           ============================================================ */
        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border: 2px solid rgba(26, 115, 232, 0.5);
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
            display: none;
        }
        .scanner-overlay.active {
            display: block;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .btn {
                font-size: 0.85rem;
                padding: 12px 14px;
                min-width: 100px;
            }
            .ticket-info {
                padding: 16px 18px;
                font-size: 0.9rem;
            }
            .validation-circle {
                width: 140px;
                height: 140px;
            }
            .validation-circle .check {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        Scanner
        <span>BETA</span>
    </h1>
    <p class="subtitle">Placez le QR code devant la camera</p>

    <div id="reader">
        <div class="scanner-overlay" id="scannerOverlay"></div>
    </div>

    <div id="result">En attente de scan...</div>

    <!-- ============================================================
         CARTE TICKET (AGGRANDIE AVEC DATE)
         ============================================================ -->
    <div class="ticket-info" id="ticketInfo">
        <div class="row">
            <span class="label">Evenement</span>
            <span class="value value-highlight" id="infoEvent">-</span>
        </div>
        <div class="row">
            <span class="label">Type</span>
            <span class="value" id="infoType">-</span>
        </div>
        <div class="row">
            <span class="label">Acheteur</span>
            <span class="value" id="infoBuyer">-</span>
        </div>
        <div class="row">
            <span class="label">Date d achat</span>
            <span class="value purchase-date" id="infoPurchaseDate">-</span>
        </div>
        <div class="row">
            <span class="label">ID</span>
            <span class="value" style="font-size:0.75rem;font-family:monospace;" id="infoId">-</span>
        </div>
    </div>

    <!-- ============================================================
         BOUTONS
         ============================================================ -->
    <div class="btn-group">
        <button class="btn btn-primary" id="scanBtn">Activer la camera</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">Accueil</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-danger" id="stopBtn" style="display:none;">Arreter le scan</button>
    </div>

    <div class="footer">
        <p>Securise via Pi Network  <a href="#" onclick="window.location.href='index.html'">Retour a Betix</a></p>
    </div>
</div>

<!-- ============================================================
     VALIDATION OVERLAY (ANIMATION DE SUCCES)
     ============================================================ -->
<div id="validationOverlay">
    <div class="validation-circle">
        <span class="check">✓</span>
    </div>
</div>

<!-- ============================================================
     CONFETTIS CONTAINER
     ============================================================ -->
<div class="confetti-container" id="confettiContainer"></div>

<!-- ============================================================
     LIBRAIRIES & SCRIPTS
     ============================================================ -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const BACKEND_URL = "https://betix-backend.onrender.com";
    let html5QrCode = null;
    let isScanning = false;

    // ============================================================
    // DOM ELEMENTS
    // ============================================================
    const readerEl = document.getElementById('reader');
    const resultEl = document.getElementById('result');
    const scanBtn = document.getElementById('scanBtn');
    const stopBtn = document.getElementById('stopBtn');
    const ticketInfo = document.getElementById('ticketInfo');
    const infoEvent = document.getElementById('infoEvent');
    const infoType = document.getElementById('infoType');
    const infoBuyer = document.getElementById('infoBuyer');
    const infoPurchaseDate = document.getElementById('infoPurchaseDate');
    const infoId = document.getElementById('infoId');
    const overlay = document.getElementById('scannerOverlay');
    const validationOverlay = document.getElementById('validationOverlay');
    const confettiContainer = document.getElementById('confettiContainer');

    // ============================================================
    // FONCTIONS
    // ============================================================

    function setResult(message, type) {
        resultEl.textContent = message;
        resultEl.className = type || '';
        if (type === 'success') {
            resultEl.innerHTML = 'Succes: ' + message;
        } else if (type === 'error') {
            resultEl.innerHTML = 'Erreur: ' + message;
        } else if (type === 'loading') {
            resultEl.innerHTML = 'Chargement: ' + message;
        } else {
            resultEl.innerHTML = message;
        }
    }

    function showTicketInfo(ticket) {
        ticketInfo.classList.add('show');
        infoEvent.textContent = ticket.event_title || 'Inconnu';
        infoType.textContent = ticket.ticket_type || 'standard';
        infoBuyer.textContent = ticket.buyer_name || 'Inconnu';
        infoId.textContent = ticket.id || '-';

        if (ticket.purchase_date) {
            const date = new Date(ticket.purchase_date);
            infoPurchaseDate.textContent = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        } else {
            infoPurchaseDate.textContent = 'Non disponible';
        }
    }

    function hideTicketInfo() {
        ticketInfo.classList.remove('show');
    }

    // ============================================================
    // ANIMATION DE SUCCES (CERCLE + CONFETTIS + SON + VIBRATION)
    // ============================================================

    function playSuccessAnimation() {
        // 1. Afficher l'overlay avec animation du cercle
        validationOverlay.classList.add('active');

        // 2. Son de succès (via Web Audio API)
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Son mélodique (accord de succès)
            const notes = [523.25, 659.25, 783.99, 1046.50]; // Do, Mi, Sol, Do
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.08 + 0.4);
                osc.start(audioCtx.currentTime + index * 0.08);
                osc.stop(audioCtx.currentTime + index * 0.08 + 0.4);
            });

            // Un petit arpège en fond
            const oscBg = audioCtx.createOscillator();
            const gainBg = audioCtx.createGain();
            oscBg.connect(gainBg);
            gainBg.connect(audioCtx.destination);
            oscBg.frequency.value = 880;
            oscBg.type = 'sine';
            gainBg.gain.setValueAtTime(0.05, audioCtx.currentTime + 0.2);
            gainBg.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            oscBg.start(audioCtx.currentTime + 0.2);
            oscBg.stop(audioCtx.currentTime + 0.8);
        } catch (e) {
            console.log('Audio non disponible');
        }

        // 3. Vibration (si disponible)
        if (navigator.vibrate) {
            navigator.vibrate([50, 50, 50, 50, 100]);
        }

        // 4. Confettis
        launchConfetti();

        // 5. Cacher l'overlay après 2.5 secondes
        setTimeout(() => {
            validationOverlay.classList.remove('active');
        }, 2500);
    }

    // ============================================================
    // CONFETTIS
    // ============================================================

    function launchConfetti() {
        const colors = ['#10b981', '#4fc3f7', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#34d399'];
        for (let i = 0; i < 60; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = (Math.random() * 8 + 4) + 'px';
            confetti.style.height = (Math.random() * 8 + 4) + 'px';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            confetti.style.animationDelay = (Math.random() * 0.8) + 's';
            confettiContainer.appendChild(confetti);

            // Supprimer après animation
            setTimeout(() => {
                confetti.remove();
            }, 3500);
        }
    }

    // ============================================================
    // VALIDATION DU TICKET (APPEL API)
    // ============================================================

    async function validateTicket(ticketId) {
        setResult('Validation en cours...', 'loading');

        try {
            const response = await fetch(`${BACKEND_URL}/api/tickets/validate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: ticketId })
            });

            const data = await response.json();

            if (data.success) {
                setResult('Ticket valide: ' + data.message, 'success');
                if (data.ticket) {
                    showTicketInfo(data.ticket);
                }
                // LANCER L'ANIMATION DE SUCCES
                playSuccessAnimation();
            } else {
                setResult('Erreur: ' + data.message, 'error');
                hideTicketInfo();
                // Son d'erreur (optionnel)
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = 220;
                    osc.type = 'square';
                    gain.gain.value = 0.1;
                    osc.start();
                    setTimeout(() => osc.stop(), 300);
                } catch (e) { /* ignore */ }
            }
        } catch (error) {
            console.error('Erreur validation:', error);
            setResult('Erreur reseau: ' + error.message, 'error');
            hideTicketInfo();
        }
    }

    // ============================================================
    // SCANNEUR
    // ============================================================

    function onScanSuccess(decodedText, decodedResult) {
        console.log('QR scanne:', decodedText);

        if (html5QrCode && isScanning) {
            html5QrCode.stop().then(() => {
                isScanning = false;
                stopBtn.style.display = 'none';
                scanBtn.textContent = 'Scanner un autre ticket';
                overlay.classList.remove('active');
            }).catch(err => {
                console.warn('Erreur arret scanner:', err);
            });
        }

        let ticketId = decodedText;
        if (ticketId.startsWith('BETIX-')) {
            ticketId = ticketId.substring(6);
            const parts = ticketId.split('-');
            if (parts.length === 3) {
                ticketId = parts[0] + '-' + parts[2];
            }
        }

        console.log('ID nettoie:', ticketId);
        validateTicket(ticketId);
    }

    function onScanError(error) {
        // ignore les erreurs mineures
    }

    async function startScanner() {
        if (isScanning) {
            return;
        }

        if (!html5QrCode) {
            try {
                html5QrCode = new Html5Qrcode("reader");
            } catch (e) {
                setResult('Erreur initialisation: ' + e.message, 'error');
                return;
            }
        }

        setResult('Demande d acces a la camera...', 'loading');
        overlay.classList.add('active');

        try {
            await html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 15,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                },
                onScanSuccess,
                onScanError
            );
            isScanning = true;
            scanBtn.textContent = 'Scan en cours...';
            stopBtn.style.display = 'block';
            setResult('Camera active, scannez un QR code', '');
            hideTicketInfo();
        } catch (error) {
            console.error('Erreur demarrage camera:', error);
            overlay.classList.remove('active');
            if (error.message && error.message.includes('NotAllowedError')) {
                setResult('Acces a la camera refuse. Autorisez l acces et reessayez.', 'error');
            } else if (error.message && error.message.includes('NotFoundError')) {
                setResult('Aucune camera trouvee sur cet appareil.', 'error');
            } else {
                setResult('Erreur: ' + error.message, 'error');
            }
            scanBtn.textContent = 'Activer la camera';
            stopBtn.style.display = 'none';
            isScanning = false;
        }
    }

    async function stopScanner() {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
                isScanning = false;
                stopBtn.style.display = 'none';
                scanBtn.textContent = 'Scanner un autre ticket';
                overlay.classList.remove('active');
                setResult('Scan arrete', '');
            } catch (error) {
                console.warn('Erreur arret:', error);
            }
        } else {
            stopBtn.style.display = 'none';
            scanBtn.textContent = 'Activer la camera';
            overlay.classList.remove('active');
        }
    }

    // ============================================================
    // EVENTS
    // ============================================================

    scanBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);

    window.addEventListener('beforeunload', function() {
        if (html5QrCode && isScanning) {
            html5QrCode.stop().catch(() => {});
        }
    });

    // ============================================================
    // AUTO START (mobile)
    // ============================================================

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        setTimeout(startScanner, 800);
    }

    console.log('Scan page loaded with animations');
    console.log('Backend URL:', BACKEND_URL);
</script>

</body>
</html>
