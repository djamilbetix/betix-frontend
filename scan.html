<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Betix - Scan Ticket</title>
    <meta name="description" content="Scannez et validez les tickets Betix" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --betix-blue: #0B1F5C;
            --betix-blue-light: #1a2a4a;
            --betix-yellow: #F5B400;
            --betix-yellow-dark: #D89C00;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray: #6b7280;
            --gray-light: #e6e6e6;
            --dark: #1a1a2e;
            --white: #ffffff;
            --bg: #f5f7fa;
        }

        html, body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .scan-header {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 1000;
            box-shadow: 0 4px 20px rgba(11,31,92,0.3);
            border-bottom: 2px solid rgba(245,180,0,0.3);
        }
        .scan-header .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.25s ease;
        }
        .scan-header .back-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .scan-header .title {
            color: white; font-size: 1.1rem; font-weight: 700;
            letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px;
        }
        .scan-header .title i { color: var(--betix-yellow); }
        .scan-header .header-action {
            background: rgba(245,180,0,0.15);
            border: 1px solid rgba(245,180,0,0.4);
            color: var(--betix-yellow);
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.25s ease; position: relative;
        }
        .scan-header .header-action:hover { background: rgba(245,180,0,0.3); }
        .scan-header .header-action .badge {
            position: absolute; top: -4px; right: -4px;
            background: var(--danger); color: white; border-radius: 50%;
            min-width: 18px; height: 18px; font-size: 0.6rem;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; border: 2px solid #0B1F5C; padding: 0 3px;
        }

        /* ============================================================
           MAIN
           ============================================================ */
        .scan-main {
            padding: 80px 16px 30px;
            max-width: 600px; margin: 0 auto; min-height: 100vh;
        }

        /* STATS */
        .scan-stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 20px;
        }
        .stat-mini {
            background: white;
            border-radius: 16px; padding: 16px 8px;
            text-align: center;
            border: 2px solid #e6e6e6;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
        }
        .stat-mini:hover {
            border-color: var(--betix-yellow);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245,180,0,0.15);
        }
        .stat-mini .num {
            font-size: 1.7rem; font-weight: 800;
            color: var(--betix-blue); line-height: 1.2;
        }
        .stat-mini .label {
            font-size: 0.65rem; color: var(--gray);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-top: 4px; font-weight: 600;
        }

        /* SCANNER */
        .scanner-card {
            background: white; border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border: 1px solid #e6e6e6;
        }
        .scanner-header {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            color: white;
        }
        .scanner-header .status {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; font-weight: 500;
        }
        .scanner-header .status .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }
        .scanner-header .status.offline .dot {
            background: var(--danger); box-shadow: 0 0 10px var(--danger);
            animation: none;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        .scanner-header h3 { font-size: 0.95rem; font-weight: 700; }

        #qr-reader {
            width: 100%; background: #0B1F5C;
            position: relative; aspect-ratio: 1 / 1;
        }
        #qr-reader video { border-radius: 0 !important; object-fit: cover !important; }
        #qr-reader__scan_region { background: transparent !important; }
        #qr-reader__scan_region img { display: none !important; }
        #qr-reader__dashboard { background: #0B1F5C !important; color: white !important; }
        #qr-reader__dashboard_section_csr button {
            background: var(--betix-yellow) !important; color: #0B1F5C !important;
            border: none !important; padding: 8px 16px !important;
            border-radius: 20px !important; font-weight: 600 !important; cursor: pointer !important;
        }

        .scanner-actions {
            display: flex; gap: 10px;
            padding: 16px; background: #f8fafc;
        }
        .scanner-actions button {
            flex: 1; padding: 14px 16px;
            border-radius: 40px; border: none;
            font-weight: 700; font-size: 0.85rem; cursor: pointer;
            transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit;
        }
        .btn-camera {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            color: white; box-shadow: 0 4px 16px rgba(11,31,92,0.3);
        }
        .btn-camera:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-camera:disabled { opacity: 0.6; cursor: wait; }
        .btn-camera.stop {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
        }
        .btn-manual {
            background: white; color: var(--betix-blue);
            border: 2px solid #e6e6e6;
        }
        .btn-manual:hover { border-color: var(--betix-yellow); background: #fffbf0; }

        /* MANUAL INPUT */
        .manual-input-section {
            display: none; padding: 20px;
            background: #f8fafc; border-top: 1px solid #e6e6e6;
        }
        .manual-input-section.show { display: block; }
        .manual-input-section label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: var(--dark); margin-bottom: 8px;
        }
        .manual-input-group { display: flex; gap: 8px; }
        .manual-input-group input {
            flex: 1; padding: 12px 16px;
            border: 2px solid #e6e6e6; border-radius: 12px;
            font-size: 0.9rem; font-family: 'Poppins', monospace;
            transition: all 0.25s; background: white;
        }
        .manual-input-group input:focus {
            outline: none; border-color: var(--betix-yellow);
            box-shadow: 0 0 0 4px rgba(245,180,0,0.15);
        }
        .manual-input-group button {
            padding: 12px 20px; border-radius: 12px; border: none;
            background: var(--betix-yellow); color: var(--betix-blue);
            font-weight: 700; cursor: pointer; transition: all 0.25s;
            font-family: inherit;
        }
        .manual-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245,180,0,0.4);
        }

        /* ============================================================
           RESULT CARD (caché par défaut)
           ============================================================ */
        .result-card {
            display: none;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            margin-top: 20px;
            border: 1px solid #e6e6e6;
        }
        .result-card.show {
            display: block;
            animation: resultPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes resultPop {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .result-banner { padding: 28px 20px; text-align: center; color: white; position: relative; }
        .result-banner.valid { background: linear-gradient(135deg, #10b981, #059669); }
        .result-banner.invalid { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .result-banner.used { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .result-banner.expired { background: linear-gradient(135deg, #6b7280, #4b5563); }
        .result-banner.refunded { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        .result-banner .icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px; font-size: 2.5rem;
            animation: iconPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .result-banner.valid .icon::after {
            content: ''; position: absolute; inset: -10px;
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.6);
            animation: haloRipple 1.5s ease-out infinite;
        }
        @keyframes haloRipple {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes iconPop {
            0% { transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .result-banner.invalid .icon { animation: iconShake 0.6s ease; }
        @keyframes iconShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        .result-banner h2 { font-size: 1.4rem; font-weight: 700; margin: 0 0 6px; }
        .result-banner p { font-size: 0.9rem; opacity: 0.95; margin: 0; }

        .result-body { padding: 20px; }
        .result-info-grid {
            display: grid; grid-template-columns: 1fr; gap: 8px;
            background: #f8fafc; border-radius: 14px; padding: 14px 16px;
            border: 1px solid #e6e6e6;
        }
        .result-info-row {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #e6e6e6;
            font-size: 0.85rem;
        }
        .result-info-row:last-child { border-bottom: none; }
        .result-info-row .label { color: var(--gray); font-weight: 500; }
        .result-info-row .value {
            color: var(--dark); font-weight: 600;
            text-align: right; max-width: 60%; word-break: break-word;
        }
        .result-actions {
            display: flex; gap: 10px;
            padding: 16px 20px 20px;
        }
        .result-actions button {
            flex: 1; padding: 14px;
            border-radius: 40px; border: none;
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            transition: all 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit;
        }
        .btn-scan-again {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            color: white; box-shadow: 0 4px 16px rgba(11,31,92,0.3);
        }
        .btn-scan-again:hover { transform: translateY(-2px); }
        .btn-close-result {
            background: #f3f4f6; color: var(--dark);
        }
        .btn-close-result:hover { background: #e5e7eb; }

        /* ============================================================
           LOADER (démarrage)
           ============================================================ */
        .scan-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
            gap: 24px;
        }
        .scan-loader.hidden { opacity: 0; pointer-events: none; }
        .scan-loader-spinner {
            width: 70px; height: 70px; border-radius: 50%;
            border: 4px solid rgba(11,31,92,0.1);
            border-top-color: var(--betix-blue);
            border-right-color: var(--betix-yellow);
            animation: spinnerRotate 1s linear infinite;
        }
        @keyframes spinnerRotate { to { transform: rotate(360deg); } }
        .scan-loader-text {
            color: var(--betix-blue); font-size: 1rem; font-weight: 600;
            letter-spacing: 1px; animation: fadeText 1.5s ease-in-out infinite;
        }
        @keyframes fadeText {
            0%,100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .scan-loader-logo {
            font-family: 'Poppins', sans-serif; font-size: 2rem;
            font-weight: 800; color: var(--betix-blue);
            letter-spacing: 2px;
            display: flex; align-items: baseline; gap: 4px;
        }
        .scan-loader-logo span { color: var(--betix-yellow); }

        /* ============================================================
           OVERLAY D'ANALYSE
           ============================================================ */
        .scanning-overlay {
            position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 99998;
            display: none;
            align-items: center; justify-content: center;
            flex-direction: column;
        }
        .scanning-overlay.show { display: flex; }

        .scanning-box {
            width: 260px; height: 260px;
            position: relative;
            border-radius: 24px;
            background: linear-gradient(135deg, #f8fafc, #eef2f7);
            border: 3px solid var(--betix-yellow);
            box-shadow: 0 0 60px rgba(245,180,0,0.25), inset 0 0 40px rgba(245,180,0,0.05);
            overflow: hidden;
            animation: boxPulse 2s ease-in-out infinite;
        }
        @keyframes boxPulse {
            0%,100% { box-shadow: 0 0 60px rgba(245,180,0,0.25), inset 0 0 40px rgba(245,180,0,0.05); }
            50% { box-shadow: 0 0 100px rgba(245,180,0,0.45), inset 0 0 60px rgba(245,180,0,0.1); }
        }
        .scanning-box .corner {
            position: absolute; width: 40px; height: 40px;
            border: 4px solid var(--betix-blue); border-radius: 8px;
        }
        .scanning-box .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .scanning-box .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
        .scanning-box .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
        .scanning-box .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }
        .scanning-box .scan-line {
            position: absolute; left: 20px; right: 20px; height: 3px;
            background: linear-gradient(90deg, transparent, var(--betix-yellow), transparent);
            box-shadow: 0 0 20px var(--betix-yellow), 0 0 40px rgba(245,180,0,0.5);
            animation: scanMove 1.8s ease-in-out infinite;
        }
        @keyframes scanMove {
            0% { top: 30px; opacity: 0.3; }
            50% { top: calc(100% - 30px); opacity: 1; }
            100% { top: 30px; opacity: 0.3; }
        }
        .scanning-box .qr-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem; color: rgba(11,31,92,0.25);
            animation: qrBlink 1.5s ease-in-out infinite;
        }
        @keyframes qrBlink {
            0%,100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.08); }
        }
        .scanning-info { margin-top: 28px; text-align: center; max-width: 320px; }
        .scanning-info .analysis-text {
            color: var(--betix-blue); font-size: 1.05rem; font-weight: 600;
            letter-spacing: 0.5px; margin-bottom: 18px;
            min-height: 28px; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .scanning-info .analysis-text i {
            color: var(--betix-yellow);
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .scanning-progress {
            width: 260px; height: 6px;
            background: rgba(11,31,92,0.1);
            border-radius: 3px; overflow: hidden; margin: 0 auto;
        }
        .scanning-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--betix-blue), var(--betix-yellow));
            border-radius: 3px; width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(245,180,0,0.6);
        }
        .scanning-percent {
            color: var(--betix-blue); font-size: 0.85rem;
            font-weight: 700; margin-top: 8px; letter-spacing: 1px;
        }

        /* ============================================================
           FLASH OVERLAY
           ============================================================ */
        .flash-overlay {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 99997; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .flash-overlay.green { background: radial-gradient(circle at center, rgba(16,185,129,0.5), rgba(16,185,129,0) 70%); }
        .flash-overlay.red { background: radial-gradient(circle at center, rgba(239,68,68,0.6), rgba(239,68,68,0) 70%); }
        .flash-overlay.flash { animation: flashAnim 0.7s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* ============================================================
           CONFETTIS
           ============================================================ */
        .confetti-container {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 99996; overflow: hidden;
        }
        .confetti-piece {
            position: absolute; width: 10px; height: 10px;
            top: -20px;
            animation: confettiFall 3s linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .scan-toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: white; border-radius: 16px; padding: 14px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            z-index: 99999;
            min-width: 280px; max-width: calc(100% - 40px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        opacity 0.3s ease, visibility 0.3s ease;
            border-left: 5px solid var(--success);
            display: flex; align-items: center; gap: 12px;
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        .scan-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1; visibility: visible; pointer-events: auto;
        }
        .scan-toast.error { border-left-color: var(--danger); }
        .scan-toast.warning { border-left-color: var(--warning); }
        .scan-toast.info { border-left-color: var(--betix-blue); }
        .scan-toast .toast-icon { font-size: 1.5rem; color: var(--success); flex-shrink: 0; }
        .scan-toast.error .toast-icon { color: var(--danger); }
        .scan-toast.warning .toast-icon { color: var(--warning); }
        .scan-toast.info .toast-icon { color: var(--betix-blue); }
        .scan-toast .toast-title { font-weight: 700; font-size: 0.9rem; color: var(--dark); margin-bottom: 2px; }
        .scan-toast .toast-message { font-size: 0.8rem; color: var(--gray); }

        /* ============================================================
           MODAL HISTORIQUE (caché par défaut)
           ============================================================ */
        .history-modal {
            position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100000;
            display: none;
            flex-direction: column;
        }
        .history-modal.show {
            display: flex;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .history-header {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 3px solid var(--betix-yellow);
            box-shadow: 0 4px 20px rgba(11,31,92,0.2);
            flex-shrink: 0;
        }
        .history-header h2 {
            color: white; font-size: 1.1rem; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .history-header h2 i { color: var(--betix-yellow); }
        .history-header .close-history {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.25s ease;
        }
        .history-header .close-history:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .history-filters {
            padding: 16px 20px 10px;
            display: flex; gap: 8px; flex-wrap: wrap;
            align-items: center; flex-shrink: 0;
            background: white;
        }
        .history-search { flex: 1; min-width: 200px; position: relative; }
        .history-search i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: var(--gray); font-size: 0.9rem;
        }
        .history-search input {
            width: 100%; padding: 10px 14px 10px 40px;
            border-radius: 12px;
            border: 2px solid #e6e6e6;
            background: #f8fafc; color: var(--dark);

<script>
// ============================================================
// CONFIGURATION SUPABASE
// ============================================================
const SUPABASE_URL = "https://tycebwzgsujiazgopkri.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5Y2Vid3pnc3VqaWF6Z29wa3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODg2NTMsImV4cCI6MjA5Nzk2NDY1M30.7x1rouTbMJE2WcY008vRnqGuAWq3yM_eZCS4Q8_3TrQ";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    db: { schema: 'public' }
});

// ============================================================
// ÉTAT GLOBAL
// ============================================================
let qrScanner = null;
let isScanning = false;
let isProcessing = false;
let currentUser = { wallet: null, piUid: null, name: 'Guest' };
let lastScannedCode = null;
let lastScannedTime = 0;
const SCAN_COOLDOWN = 2000;
let scanStats = { today: 0, total: 0, valid: 0 };
let scanHistory = [];
let currentHistoryFilter = 'all';
let currentScanIdForDeletion = null;
let audioCtx = null;

// ============================================================
// INITIALISATION
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    console.log('🎫 Betix Scan - Initialisation');
    loadCurrentUser();
    loadScanStats();
    loadScanHistory();
    updateHistoryBadge();

    if (!currentUser.wallet && !currentUser.piUid) {
        showToast('Non connecté', 'Connectez-vous d\'abord à Betix', 'warning');
        setTimeout(() => { window.location.href = 'index.html'; }, 2500);
        return;
    }

    setTimeout(() => {
        document.getElementById('scanLoader').classList.add('hidden');
        setTimeout(() => {
            document.getElementById('scanLoader').style.display = 'none';
        }, 500);
    }, 1200);

    updateStatsUI();
    initQrScanner();

    // Charger l'historique depuis Supabase
    setTimeout(async () => {
        try {
            const remoteHistory = await loadScanHistoryFromSupabase();
            if (remoteHistory.length > 0) {
                const merged = [...remoteHistory];
                const localOnly = scanHistory.filter(local => {
                    return !remoteHistory.some(r =>
                        (r.code === local.code &&
                         Math.abs(new Date(r.timestamp) - new Date(local.timestamp)) < 60000)
                    );
                });
                scanHistory = [...localOnly, ...merged].sort((a, b) =>
                    new Date(b.timestamp) - new Date(a.timestamp)
                );
                if (scanHistory.length > 500) scanHistory = scanHistory.slice(0, 500);
                saveScanHistory();
                updateHistoryBadge();
                console.log('☁️ Historique synchronisé:', remoteHistory.length, 'entrées');
            }
        } catch (e) {
            console.warn('Sync history from Supabase failed:', e);
        }
    }, 1500);
});

function loadCurrentUser() {
    try {
        const savedUser = localStorage.getItem('betix_user');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            if (userData.wallet || userData.piUid) {
                currentUser = userData;
                console.log('✅ Utilisateur chargé:', currentUser.wallet || currentUser.piUid);
            }
        }
    } catch (e) { console.error('Erreur chargement utilisateur:', e); }
}

function loadScanStats() {
    try {
        const saved = localStorage.getItem('betix_scan_stats');
        if (saved) {
            const data = JSON.parse(saved);
            const today = new Date().toDateString();
            if (data.date === today) scanStats = data;
            else scanStats = { today: 0, total: data.total || 0, valid: 0, date: today };
        } else {
            scanStats = { today: 0, total: 0, valid: 0, date: new Date().toDateString() };
        }
    } catch (e) {
        scanStats = { today: 0, total: 0, valid: 0, date: new Date().toDateString() };
    }
}

function saveScanStats() {
    scanStats.date = new Date().toDateString();
    localStorage.setItem('betix_scan_stats', JSON.stringify(scanStats));
}

function updateStatsUI() {
    document.getElementById('statToday').textContent = scanStats.today || 0;
    document.getElementById('statTotal').textContent = scanStats.total || 0;
    document.getElementById('statValid').textContent = scanStats.valid || 0;
}

// ============================================================
// HISTORIQUE LOCAL + SUPABASE
// ============================================================
function loadScanHistory() {
    try {
        const saved = localStorage.getItem('betix_scan_history');
        scanHistory = saved ? JSON.parse(saved) : [];
        if (!Array.isArray(scanHistory)) scanHistory = [];
    } catch (e) {
        console.error('Erreur chargement historique:', e);
        scanHistory = [];
    }
}

function saveScanHistory() {
    try {
        if (scanHistory.length > 500) scanHistory = scanHistory.slice(0, 500);
        localStorage.setItem('betix_scan_history', JSON.stringify(scanHistory));
    } catch (e) { console.error('Erreur sauvegarde historique:', e); }
}

async function saveScanToSupabase(entry) {
    try {
        const userId = currentUser.piUid || currentUser.wallet;
        if (!userId) return null;

        const dbEntry = {
            ticket_id: entry.code || '',
            ticket_code: entry.code || '',
            event_id: entry.eventId || '',
            event_title: entry.eventTitle || 'N/A',
            buyer_name: entry.buyerName || 'N/A',
            buyer_email: entry.buyerEmail || '',
            buyer_phone: entry.buyerPhone || '',
            ticket_type: entry.ticketType || 'standard',
            price: parseFloat(entry.price) || 0,
            status: entry.status || 'valid',
            message: entry.message || '',
            scanned_by_pi_uid: userId,
            scanned_by_name: currentUser.name || currentUser.first_name || 'Organisateur',
            scanned_at: entry.timestamp || new Date().toISOString()
        };

        const { data, error } = await supabaseClient
            .from('scan_history')
            .insert(dbEntry)
            .select()
            .single();

        if (error) {
            console.error('❌ Erreur save scan Supabase:', error);
            return null;
        }
        console.log('✅ Scan sauvegardé dans Supabase:', data.id);
        return data;
    } catch (err) {
        console.error('saveScanToSupabase exception:', err);
        return null;
    }
}

async function loadScanHistoryFromSupabase() {
    try {
        const userId = currentUser.piUid || currentUser.wallet;
        if (!userId) return [];

        const { data, error } = await supabaseClient
            .from('scan_history')
            .select('*')
            .eq('scanned_by_pi_uid', userId)
            .order('scanned_at', { ascending: false })
            .limit(500);

        if (error) {
            console.error('❌ Erreur load scan Supabase:', error);
            return [];
        }

        return (data || []).map(row => ({
            id: row.id,
            timestamp: row.scanned_at,
            code: row.ticket_code || row.ticket_id || '',
            eventId: row.event_id || '',
            eventTitle: row.event_title || 'N/A',
            buyerName: row.buyer_name || 'N/A',
            buyerEmail: row.buyer_email || '',
            buyerPhone: row.buyer_phone || '',
            ticketType: row.ticket_type || 'standard',
            price: row.price || 0,
            status: row.status || 'valid',
            message: row.message || '',
            scannedBy: row.scanned_by_name || row.scanned_by_pi_uid || 'Anonyme'
        }));
    } catch (err) {
        console.error('loadScanHistoryFromSupabase exception:', err);
        return [];
    }
}

async function deleteScanFromSupabase(scanId) {
    try {
        const { error } = await supabaseClient
            .from('scan_history')
            .delete()
            .eq('id', scanId);
        if (error) throw error;
        return true;
    } catch (err) {
        console.error('deleteScanFromSupabase error:', err);
        return false;
    }
}

async function clearAllScansFromSupabase() {
    try {
        const userId = currentUser.piUid || currentUser.wallet;
        if (!userId) return false;
        const { error } = await supabaseClient
            .from('scan_history')
            .delete()
            .eq('scanned_by_pi_uid', userId);
        if (error) throw error;
        return true;
    } catch (err) {
        console.error('clearAllScansFromSupabase error:', err);
        return false;
    }
}

async function addScanToHistory(entry) {
    const localEntry = {
        id: 'scan_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        timestamp: new Date().toISOString(),
        code: entry.code || '',
        eventId: entry.eventId || '',
        eventTitle: entry.eventTitle || 'N/A',
        buyerName: entry.buyerName || 'N/A',
        buyerEmail: entry.buyerEmail || '',
        buyerPhone: entry.buyerPhone || '',
        ticketType: entry.ticketType || 'standard',
        price: entry.price || 0,
        status: entry.status || 'valid',
        scannedBy: currentUser.wallet || currentUser.piUid || 'Anonyme',
        message: entry.message || ''
    };

    scanHistory.unshift(localEntry);
    saveScanHistory();
    updateHistoryBadge();

    try {
        const saved = await saveScanToSupabase(localEntry);
        if (saved && saved.id) {
            const idx = scanHistory.findIndex(h => h.id === localEntry.id);
            if (idx !== -1) {
                scanHistory[idx].id = saved.id;
                saveScanHistory();
            }
        }
    } catch (e) {
        console.warn('Sync scan to Supabase failed:', e);
    }
}

function setHistoryFilter(filter) {
    currentHistoryFilter = filter;
    document.querySelectorAll('.history-filter-btns button').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
    });
    renderHistoryTable();

function getFilteredHistory() {
    const search = (document.getElementById('historySearchInput')?.value || '').toLowerCase().trim();
    const now = Date.now();
    const oneDayAgo = now - (24 * 60 * 60 * 1000);
    const oneWeekAgo = now - (7 * 24 * 60 * 60 * 1000);

    return scanHistory.filter(h => {
        const ts = new Date(h.timestamp).getTime();
        if (currentHistoryFilter === 'today' && ts < oneDayAgo) return false;
        if (currentHistoryFilter === 'week' && ts < oneWeekAgo) return false;
        if (currentHistoryFilter === 'valid' && h.status !== 'valid') return false;
        if (currentHistoryFilter === 'invalid' && h.status === 'valid') return false;

        if (search) {
            const haystack = [h.code, h.eventTitle, h.buyerName, h.buyerEmail, h.scannedBy].join(' ').toLowerCase();
            if (!haystack.includes(search)) return false;
        }
        return true;
    });
}

    const filtered = getFilteredHistory();

        const st = statusLabels[h.status] || statusLabels.valid;

function exportHistoryCSV() {
    const filtered = getFilteredHistory();
    if (filtered.length === 0) {
        showToast('Export', 'Aucun scan à exporter.', 'info');
        return;
    }
    const rows = [['Date', 'Heure', 'Code', 'Événement', 'Acheteur', 'Email', 'Type', 'Prix (Pi)', 'Statut', 'Scanné par']];
    filtered.forEach(h => {
        const d = new Date(h.timestamp);
        rows.push([
            d.toLocaleDateString('fr-FR'), d.toLocaleTimeString('fr-FR'),
            h.code, h.eventTitle, h.buyerName, h.buyerEmail,
            h.ticketType, Number(h.price).toFixed(6), h.status, h.scannedBy
        ]);
    });
    const csv = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'betix_scan_history_' + Date.now() + '.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 0);
    showToast('Export réussi', filtered.length + ' scan(s) exporté(s).', 'success');
}

async function clearHistory() {
    if (!confirm('Voulez-vous vraiment vider tout l\'historique des scans ? Cette action supprimera aussi le cloud.')) return;

    scanHistory = [];
    saveScanHistory();
    updateHistoryBadge();

}

function initQrScanner() {
    if (typeof Html5Qrcode === 'undefined') return;
    qrScanner = new Html5Qrcode("qr-reader", {
        verbose: false,
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });
    document.addEventListener('click', () => getAudioCtx(), { once: true });
    document.addEventListener('touchstart', () => getAudioCtx(), { once: true });
}

async function toggleScanner() {
    const btn = document.getElementById('startBtn');
    if (isScanning) { await stopScanner(); return; }
    if (!qrScanner) { showToast('Erreur', 'Scanner non disponible', 'error'); return; }

    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        disableFlip: false
    };

    try {
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Démarrage...';
        btn.disabled = true;
        await qrScanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
        );
        isScanning = true;
        btn.innerHTML = '<i class="fas fa-stop"></i> Arrêter la caméra';
        btn.classList.add('stop');
        btn.disabled = false;
        updateScannerStatus(true);
    } catch (err) {
        console.error('❌ Erreur démarrage caméra:', err);
        btn.innerHTML = '<i class="fas fa-play"></i> Démarrer la caméra';
        btn.classList.remove('stop');
        btn.disabled = false;
        showToast('Caméra indisponible', 'Utilisez la saisie manuelle', 'error');
    }
}

async function stopScanner() {
    if (!qrScanner || !isScanning) return;
    try {
        await qrScanner.stop();
        isScanning = false;
        const btn = document.getElementById('startBtn');
        btn.innerHTML = '<i class="fas fa-play"></i> Démarrer la caméra';
        btn.classList.remove('stop');
        updateScannerStatus(false);
    } catch (err) { console.error('Erreur arrêt scanner:', err); }
}

function updateScannerStatus(online) {
    const status = document.getElementById('scannerStatus');
    const text = status.querySelector('span:last-child');
    if (online) { status.classList.remove('offline'); text.textContent = 'Scan actif'; }
    else { status.classList.add('offline'); text.textContent = 'Prêt'; }
}

function onScanSuccess(decodedText) {
    if (isProcessing) return;
    const now = Date.now();
    if (decodedText === lastScannedCode && (now - lastScannedTime) < SCAN_COOLDOWN) return;
    lastScannedCode = decodedText;
    lastScannedTime = now;
    vibrate([50, 30, 50]);
    playScanBeep();
    processTicketCode(decodedText);
}

function onScanError() { /* silencieux */ }

function toggleManualInput() {
    const section = document.getElementById('manualInputSection');
    section.classList.toggle('show');
    if (section.classList.contains('show')) {
        setTimeout(() => document.getElementById('manualCodeInput').focus(), 100);

    if (!code) { showToast('Erreur', 'Veuillez saisir un code', 'warning'); return; }
    input.value = '';
    processTicketCode(code);

const ANALYSIS_STEPS = [
    { text: 'Analyse du ticket...', icon: 'fa-circle-notch', progress: 20 },
    { text: 'Lecture des données...', icon: 'fa-database', progress: 45 },
    { text: 'Vérification du statut...', icon: 'fa-shield-alt', progress: 70 },
    { text: 'Validation finale...', icon: 'fa-check-double', progress: 95 }
];

let analysisInterval = null;
let currentStepIndex = 0;

function showScanningOverlay() {
    isProcessing = true;
    currentStepIndex = 0;
    const overlay = document.getElementById('scanningOverlay');
    const progressBar = document.getElementById('scanProgressBar');
    const percentEl = document.getElementById('scanPercent');
    const textEl = document.getElementById('analysisText');

    overlay.classList.add('show');
    progressBar.style.width = '0%';
    percentEl.textContent = '0%';

    const updateStep = () => {
        const step = ANALYSIS_STEPS[currentStepIndex];
        textEl.innerHTML = `<i class="fas ${step.icon}"></i><span>${step.text}</span>`;
        progressBar.style.width = step.progress + '%';
        percentEl.textContent = step.progress + '%';
    };
    updateStep();

    analysisInterval = setInterval(() => {
        currentStepIndex++;
        if (currentStepIndex < ANALYSIS_STEPS.length) updateStep();
    }, 500);

    return new Promise(resolve => setTimeout(resolve, 2200));
}

function hideScanningOverlay() {
    if (analysisInterval) { clearInterval(analysisInterval); analysisInterval = null; }
    const overlay = document.getElementById('scanningOverlay');
    const progressBar = document.getElementById('scanProgressBar');
    const percentEl = document.getElementById('scanPercent');
    progressBar.style.width = '100%';
    percentEl.textContent = '100%';
    setTimeout(() => {
        overlay.classList.remove('show');
        isProcessing = false;
    }, 300);
}

// ============================================================
// SONS
// ============================================================
function getAudioCtx() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playTone(freq, duration, delay = 0, volume = 0.15, type = 'sine') {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type;
        osc.frequency.value = freq;
        const startTime = ctx.currentTime + delay;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.05);
    } catch(e) {}
}

function playScanBeep() { playTone(1400, 0.08, 0, 0.06, 'sine'); }

}

}

// ============================================================
// TRAITEMENT DU TICKET
// ============================================================
async function processTicketCode(code) {
    if (isProcessing) return;
    const overlayPromise = showScanningOverlay();

    try {
        const { data, error } = await supabaseClient
            .from('tickets').select('*').eq('id', code).maybeSingle();

        let ticketData = data;
        if (error || !data) {
            const { data: data2, error: error2 } = await supabaseClient
                .from('tickets').select('*').eq('qr_code', code).maybeSingle();
            if (!error2 && data2) ticketData = data2;
        }

        await overlayPromise;

        if (!ticketData) {
            scanStats.total++;
            saveScanStats();
            updateStatsUI();
            await addScanToHistory({
                code, eventTitle: 'N/A', buyerName: 'N/A',
                status: 'invalid', message: 'Ticket introuvable'
            });
            hideScanningOverlay();
            setTimeout(() => {
                playErrorSound();
                vibrate([200, 100, 200, 100, 200]);
                triggerFlash('red');
                showResult('invalid', '❌ Ticket introuvable', 'Ce ticket n\'existe pas dans le système', {
                    'Code scanné': code
                });
            }, 350);
            return;
        }

        hideScanningOverlay();
        setTimeout(() => handleTicketData(ticketData), 350);
    } catch (err) {
        console.error('Erreur traitement:', err);
        await overlayPromise;
        hideScanningOverlay();
        await addScanToHistory({
            code, eventTitle: 'N/A', buyerName: 'N/A',
            status: 'invalid', message: 'Erreur de connexion'
        });
        setTimeout(() => {
            playErrorSound();
            vibrate([200, 100, 200]);
            triggerFlash('red');
            showResult('invalid', '❌ Erreur de connexion', 'Impossible de vérifier le ticket', {
                'Code scanné': code
            });
        }, 350);
    }
}

async function handleTicketData(ticket) {
    scanStats.total++;
    saveScanStats();
    const status = (ticket.status || 'Valid').toLowerCase();

    if (status === 'used') {
        updateStatsUI();
        await addScanToHistory({
            code: ticket.id, eventId: ticket.event_id,
            eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A',
            buyerEmail: ticket.buyer_email || '',
            buyerPhone: ticket.buyer_phone || '',
            ticketType: ticket.ticket_type || 'standard',
            price: ticket.price || 0,
            status: 'used', message: 'Déjà utilisé'
        });
        playWarningSound();
        vibrate([100, 50, 100, 50, 100]);
        triggerFlash('red');
        showResult('used', '⚠️ Ticket déjà utilisé', 'Ce ticket a déjà été scanné', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Type': (ticket.ticket_type || 'standard').toUpperCase(),
            'Utilisé le': ticket.used_at ? new Date(ticket.used_at).toLocaleString('fr-FR') : 'Inconnu'
        });
        return;
    }

    if (status === 'expired') {
        updateStatsUI();
        await addScanToHistory({
            code: ticket.id, eventId: ticket.event_id,
            eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A',
            ticketType: ticket.ticket_type || 'standard',
            price: ticket.price || 0,
            status: 'expired', message: 'Ticket expiré'
        });
        playExpiredSound();
        vibrate([150, 80, 150]);
        triggerFlash('red');
        showResult('expired', '⏰ Ticket expiré', 'Ce ticket a dépassé sa date de validité', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Date expiration': ticket.expiration_date ? new Date(ticket.expiration_date).toLocaleString('fr-FR') : 'N/A'
        });
        return;
    }

    if (status === 'refunded' || ticket.refunded) {
        updateStatsUI();
        await addScanToHistory({
            code: ticket.id, eventId: ticket.event_id,
            eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A',
            ticketType: ticket.ticket_type || 'standard',
            price: ticket.price || 0,
            status: 'refunded', message: 'Ticket remboursé'
        });
        playRefundedSound();
        vibrate([100, 50, 100]);
        triggerFlash('red');
        showResult('refunded', '↩️ Ticket remboursé', 'Ce ticket a été remboursé', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Montant': (parseFloat(ticket.price) || 0).toFixed(6) + ' Pi'
        });
        return;
    }

    const userId = currentUser.piUid || currentUser.wallet;
    const organizerId = ticket.organizer_pi_uid || ticket.organizer_uid;
    if (organizerId && String(organizerId) !== String(userId)) {
        const isAdmin = localStorage.getItem('betix_admin_password') !== null;
        if (!isAdmin) {
            updateStatsUI();
            await addScanToHistory({
                code: ticket.id, eventId: ticket.event_id,
                eventTitle: ticket.event_title || 'N/A',
                buyerName: ticket.buyer_name || 'N/A',
                ticketType: ticket.ticket_type || 'standard',
                price: ticket.price || 0,
                status: 'invalid', message: 'Non organisateur'
            });
            playErrorSound();
            vibrate([200, 100, 200, 100, 200]);
            triggerFlash('red');
            showResult('invalid', '❌ Accès refusé', 'Vous n\'êtes pas l\'organisateur', {
                'Événement': ticket.event_title || 'N/A',
                'Organisateur': ticket.organizer_name || 'N/A'
            });
            return;
        }
    }

    const eventDate = ticket.event_date || ticket.purchase_date;
    if (eventDate) {
        const eventEnd = new Date(eventDate);
        const duration = parseFloat(ticket.duration_value) || 3;
        switch (ticket.duration_unit) {
            case 'hours': eventEnd.setHours(eventEnd.getHours() + duration); break;
            case 'days': eventEnd.setDate(eventEnd.getDate() + duration); break;
            case 'weeks': eventEnd.setDate(eventEnd.getDate() + duration * 7); break;
            default: eventEnd.setHours(eventEnd.getHours() + 3);
        }
        if (Date.now() > eventEnd.getTime() + (24 * 60 * 60 * 1000)) {
            updateStatsUI();
            await addScanToHistory({
                code: ticket.id, eventId: ticket.event_id,
                eventTitle: ticket.event_title || 'N/A',
                buyerName: ticket.buyer_name || 'N/A',
                ticketType: ticket.ticket_type || 'standard',
                price: ticket.price || 0,
                status: 'expired', message: 'Événement terminé'
            });
            playExpiredSound();
            vibrate([150, 80, 150]);
            triggerFlash('red');
            showResult('expired', '⏰ Événement terminé', 'La date est dépassée', {
                'Événement': ticket.event_title || 'N/A',
                'Date': new Date(eventDate).toLocaleString('fr-FR')
            });
            return;
        }
    }

    await markTicketAsUsed(ticket);
}

async function markTicketAsUsed(ticket) {
    const now = new Date().toISOString();
    try {
        const { error } = await supabaseClient
            .from('tickets')
            .update({
                status: 'Used',
                used_at: now,
                scanned_by: currentUser.piUid || currentUser.wallet,
                updated_at: now
            })
            .eq('id', ticket.id);

        if (error) {
            console.error('Erreur update Supabase:', error);
            showToast('Erreur', 'Impossible de marquer le ticket', 'error');
            playErrorSound();
            vibrate([200, 100, 200]);
            return;
        }

        scanStats.valid++;
        saveScanStats();
        updateStatsUI();

        await addScanToHistory({
            code: ticket.id, eventId: ticket.event_id,
            eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A',
            buyerEmail: ticket.buyer_email || '',
            buyerPhone: ticket.buyer_phone || '',
            ticketType: ticket.ticket_type || 'standard',
            price: ticket.price || 0,
            status: 'valid', message: 'Accès autorisé'
        });

        playSuccessSound();
        vibrate([50, 30, 50, 30, 100]);
        triggerFlash('green');
        launchConfetti();

        showResult('valid', '✅ Ticket valide', 'Accès autorisé — Bonne expérience !', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Email': ticket.buyer_email || 'N/A',
            'Téléphone': ticket.buyer_phone || 'N/A',
            'Type': (ticket.ticket_type || 'standard').toUpperCase(),
            'Prix': (parseFloat(ticket.price) || 0).toFixed(6) + ' Pi',
            'N° Ticket': ticket.ticket_number || 'N/A',
            'Scanné le': new Date(now).toLocaleString('fr-FR')
        });
    } catch (err) {
        console.error('Erreur marquage:', err);
        playErrorSound();
        vibrate([200, 100, 200]);
        showToast('Erreur', 'Erreur lors du marquage', 'error');
    }
}

// ============================================================
// AFFICHAGE RÉSULTAT
// ============================================================
function showResult(type, title, subtitle, info) {
    const card = document.getElementById('resultCard');
    const banner = document.getElementById('resultBanner');
    const icon = document.getElementById('resultIcon');

    banner.className = 'result-banner ' + type;
    const icons = {
        valid: 'fa-check-circle',
        invalid: 'fa-times-circle',
        used: 'fa-exclamation-circle',
        expired: 'fa-clock',
        refunded: 'fa-undo'
    };
    icon.innerHTML = '<i class="fas ' + (icons[type] || 'fa-info-circle') + '"></i>';

    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultSubtitle').textContent = subtitle;

    const grid = document.getElementById('resultInfoGrid');
    grid.innerHTML = '';
    Object.keys(info).forEach(key => {
        grid.innerHTML += '<div class="result-info-row">' +
            '<span class="label">' + escapeHtml(key) + '</span>' +
            '<span class="value">' + escapeHtml(String(info[key])) + '</span>' +
        '</div>';
    });

    card.classList.add('show');
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function closeResult() {
    document.getElementById('resultCard').classList.remove('show');
}

async function scanAgain() {
    closeResult();
    if (!isScanning) await toggleScanner();
}

async function goBack() {
    if (isScanning) await stopScanner();
    window.location.href = 'index.html';
}

// ============================================================
// UTILITAIRES
// ============================================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#39;';
        return m;
    });
}

function vibrate(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
    }
}

let toastTimeout = null;
function showToast(title, message, type = 'success', duration = 3000) {
    const toast = document.getElementById('scanToast');
    const icon = document.getElementById('toastIcon');
    if (!toast) return;

    toast.className = 'scan-toast ' + type;
    toast.style.opacity = '';
    toast.style.visibility = '';

    const icons = {
        success: 'fa-check-circle',
        error: 'fa-times-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    if (icon) icon.className = 'fas ' + (icons[type] || 'fa-info-circle') + ' toast-icon';
    const titleEl = document.getElementById('toastTitle');
    const msgEl = document.getElementById('toastMessage');
    if (titleEl) titleEl.textContent = title;
    if (msgEl) msgEl.textContent = message;

    toast.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
            if (!toast.classList.contains('show')) {
                toast.style.opacity = '0';
                toast.style.visibility = 'hidden';
            }
        }, 400);
    }, duration);
}

window.addEventListener('beforeunload', async () => {
    if (isScanning && qrScanner) {
        try { await qrScanner.stop(); } catch (e) {}
    }
});
</script>
