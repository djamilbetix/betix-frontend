<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Betix - Scan Ticket</title>
    <meta name="description" content="Scannez et validez les tickets Betix" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0B1F5C;
            --primary-light: #1a2a4a;
            --accent: #F5B400;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray: #6b7280;
            --dark: #1a1a2e;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0f1e;
            color: #1f2937;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .scan-header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(245,180,0,0.2);
        }
        .scan-header .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.25s ease;
        }
        .scan-header .back-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .scan-header .title {
            color: white; font-size: 1.1rem; font-weight: 700;
            letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px;
        }
        .scan-header .title i { color: var(--accent); }
        .scan-header .header-action {
            background: rgba(245,180,0,0.15);
            border: 1px solid rgba(245,180,0,0.3);
            color: var(--accent); width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.25s ease; position: relative;
        }
        .scan-header .header-action:hover { background: rgba(245,180,0,0.3); }
        .scan-header .header-action .badge {
            position: absolute; top: -4px; right: -4px;
            background: var(--danger); color: white; border-radius: 50%;
            min-width: 18px; height: 18px; font-size: 0.6rem;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; border: 2px solid #0B1F5C; padding: 0 3px;
        }

        /* ============================================================
           MAIN
           ============================================================ */
        .scan-main { padding: 80px 16px 30px; max-width: 600px; margin: 0 auto; min-height: 100vh; }

        /* STATS */
        .scan-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-mini {
            background: linear-gradient(135deg, #131c33, #0B1F5C);
            border-radius: 14px; padding: 14px 8px; text-align: center;
            border: 1px solid rgba(245,180,0,0.15);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .stat-mini .num { font-size: 1.6rem; font-weight: 800; color: var(--accent); line-height: 1.2; }
        .stat-mini .label {
            font-size: 0.65rem; color: #a0b4cc;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-top: 4px; font-weight: 500;
        }

        /* SCANNER */
        .scanner-card {
            background: #ffffff; border-radius: 24px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4); margin-bottom: 20px;
            border: 1px solid rgba(245,180,0,0.15);
        }
        .scanner-header {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            padding: 16px 20px; display: flex;
            align-items: center; justify-content: space-between; color: white;
        }
        .scanner-header .status {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; font-weight: 500;
        }
        .scanner-header .status .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }
        .scanner-header .status.offline .dot {
            background: var(--danger); box-shadow: 0 0 10px var(--danger);
            animation: none;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        .scanner-header h3 { font-size: 0.95rem; font-weight: 700; }

        #qr-reader { width: 100%; background: #000; position: relative; aspect-ratio: 1 / 1; }
        #qr-reader video { border-radius: 0 !important; object-fit: cover !important; }
        #qr-reader__scan_region { background: transparent !important; }
        #qr-reader__scan_region img { display: none !important; }
        #qr-reader__dashboard { background: #0B1F5C !important; color: white !important; }
        #qr-reader__dashboard_section_csr button {
            background: var(--accent) !important; color: #0B1F5C !important;
            border: none !important; padding: 8px 16px !important;
            border-radius: 20px !important; font-weight: 600 !important; cursor: pointer !important;
        }

        .scanner-actions { display: flex; gap: 10px; padding: 16px; background: #f8fafc; }
        .scanner-actions button {
            flex: 1; padding: 12px 16px; border-radius: 40px; border: none;
            font-weight: 600; font-size: 0.85rem; cursor: pointer;
            transition: all 0.25s ease; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-camera {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            color: white; box-shadow: 0 4px 16px rgba(11,31,92,0.3);
        }
        .btn-camera:hover { transform: translateY(-2px); }
        .btn-camera.stop { background: linear-gradient(135deg, #7f1d1d, #991b1b); }
        .btn-manual {
            background: white; color: #0B1F5C; border: 2px solid #e6e6e6;
        }
        .btn-manual:hover { border-color: var(--accent); }

        /* MANUAL INPUT */
        .manual-input-section {
            display: none; padding: 20px; background: #f8fafc;
            border-top: 1px solid #e6e6e6;
        }
        .manual-input-section.show { display: block; }
        .manual-input-section label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: var(--dark); margin-bottom: 8px;
        }
        .manual-input-group { display: flex; gap: 8px; }
        .manual-input-group input {
            flex: 1; padding: 12px 16px; border: 2px solid #e6e6e6;
            border-radius: 12px; font-size: 0.9rem;
            font-family: 'Poppins', monospace; transition: all 0.25s; background: white;
        }
        .manual-input-group input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(245,180,0,0.15);
        }
        .manual-input-group button {
            padding: 12px 20px; border-radius: 12px; border: none;
            background: var(--accent); color: #0B1F5C; font-weight: 700;
            cursor: pointer; transition: all 0.25s;
        }
        .manual-input-group button:hover {
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,180,0,0.4);
        }

        /* ============================================================
           RESULT DISPLAY
           ============================================================ */
        .result-card {
            display: none; background: white; border-radius: 24px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4); margin-top: 20px;
            border: 1px solid rgba(245,180,0,0.15);
            animation: resultPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-card.show { display: block; }
        @keyframes resultPop {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .result-banner { padding: 24px 20px; text-align: center; color: white; position: relative; }
        .result-banner.valid { background: linear-gradient(135deg, #10b981, #059669); }
        .result-banner.invalid { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .result-banner.used { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .result-banner.expired { background: linear-gradient(135deg, #6b7280, #4b5563); }
        .result-banner.refunded { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        .result-banner .icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; font-size: 2.5rem;
            animation: iconPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .result-banner.valid .icon::after {
            content: ''; position: absolute; inset: -10px;
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.6);
            animation: haloRipple 1.5s ease-out infinite;
        }
        @keyframes haloRipple {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes iconPop {
            0% { transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .result-banner.invalid .icon {
            animation: iconShake 0.6s ease;
        }
        @keyframes iconShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        .result-banner h2 { font-size: 1.4rem; font-weight: 700; margin: 0 0 6px; }
        .result-banner p { font-size: 0.9rem; opacity: 0.9; margin: 0; }
        .result-body { padding: 20px; }
        .result-info-grid {
            display: grid; grid-template-columns: 1fr; gap: 8px;
            background: #f8fafc; border-radius: 14px; padding: 14px 16px;
        }
        .result-info-row {
            display: flex; justify-content: space-between;
            padding: 6px 0; border-bottom: 1px solid #e6e6e6; font-size: 0.85rem;
        }
        .result-info-row:last-child { border-bottom: none; }
        .result-info-row .label { color: var(--gray); font-weight: 500; }
        .result-info-row .value {
            color: var(--dark); font-weight: 600;
            text-align: right; max-width: 60%; word-break: break-word;
        }
        .result-actions { display: flex; gap: 10px; padding: 16px 20px 20px; }
        .result-actions button {
            flex: 1; padding: 14px; border-radius: 40px; border: none;
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            transition: all 0.25s; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-scan-again {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            color: white; box-shadow: 0 4px 16px rgba(11,31,92,0.3);
        }
        .btn-scan-again:hover { transform: translateY(-2px); }
        .btn-close-result { background: #f3f4f6; color: var(--dark); }
        .btn-close-result:hover { background: #e5e7eb; }

        /* ============================================================
           LOADER (démarrage)
           ============================================================ */
        .scan-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 40%, #0B1F5C 0%, #060b1a 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 99999; transition: opacity 0.5s ease; gap: 24px;
        }
        .scan-loader.hidden { opacity: 0; pointer-events: none; }
        .scan-loader-spinner {
            width: 70px; height: 70px; border-radius: 50%;
            border: 4px solid rgba(245,180,0,0.2);
            border-top-color: var(--accent);
            animation: spinnerRotate 1s linear infinite;
        }
        @keyframes spinnerRotate { to { transform: rotate(360deg); } }
        .scan-loader-text {
            color: white; font-size: 1rem; font-weight: 500;
            letter-spacing: 1px; animation: fadeText 1.5s ease-in-out infinite;
        }
        @keyframes fadeText {
            0%,100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .scan-loader-logo {
            font-family: 'Poppins', sans-serif; font-size: 2rem;
            font-weight: 800; color: white; letter-spacing: 2px;
            display: flex; align-items: baseline; gap: 4px;
        }
        .scan-loader-logo span { color: var(--accent); }

        /* ============================================================
           🎬 OVERLAY D'ANALYSE (pendant le scan)
           ============================================================ */
        .scanning-overlay {
            position: fixed; inset: 0;
            background: rgba(5, 10, 20, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 99998;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            animation: fadeIn 0.25s ease;
        }
        .scanning-overlay.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .scanning-box {
            width: 260px; height: 260px;
            position: relative;
            border-radius: 24px;
            background: linear-gradient(135deg, #131c33, #0B1F5C);
            border: 2px solid rgba(245,180,0,0.4);
            box-shadow: 0 0 60px rgba(245,180,0,0.3), inset 0 0 40px rgba(245,180,0,0.05);
            overflow: hidden;
            animation: boxPulse 2s ease-in-out infinite;
        }
        @keyframes boxPulse {
            0%,100% { box-shadow: 0 0 60px rgba(245,180,0,0.3), inset 0 0 40px rgba(245,180,0,0.05); }
            50% { box-shadow: 0 0 100px rgba(245,180,0,0.5), inset 0 0 60px rgba(245,180,0,0.1); }
        }

        /* Coins décoratifs */
        .scanning-box .corner {
            position: absolute;
            width: 40px; height: 40px;
            border: 4px solid var(--accent);
            border-radius: 8px;
        }
        .scanning-box .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .scanning-box .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
        .scanning-box .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
        .scanning-box .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        /* Ligne de scan qui descend */
        .scanning-box .scan-line {
            position: absolute;
            left: 20px; right: 20px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 20px var(--accent), 0 0 40px rgba(245,180,0,0.5);
            animation: scanMove 1.8s ease-in-out infinite;
        }
        @keyframes scanMove {
            0% { top: 30px; opacity: 0.3; }
            50% { top: calc(100% - 30px); opacity: 1; }
            100% { top: 30px; opacity: 0.3; }
        }

        /* Icône QR centrale */
        .scanning-box .qr-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            color: rgba(245,180,0,0.35);
            animation: qrBlink 1.5s ease-in-out infinite;
        }
        @keyframes qrBlink {
            0%,100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.08); }
        }

        .scanning-info {
            margin-top: 28px;
            text-align: center;
            max-width: 320px;
        }
        .scanning-info .analysis-text {
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .scanning-info .analysis-text i {
            color: var(--accent);
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .scanning-progress {
            width: 260px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto;
        }
        .scanning-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #F5B400, #D89C00);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(245,180,0,0.6);
        }
        .scanning-percent {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* ============================================================
           ⚡ FLASH OVERLAY (vert / rouge)
           ============================================================ */
        .flash-overlay {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 99997;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .flash-overlay.green { background: radial-gradient(circle at center, rgba(16,185,129,0.6), rgba(16,185,129,0) 70%); }
        .flash-overlay.red { background: radial-gradient(circle at center, rgba(239,68,68,0.7), rgba(239,68,68,0) 70%); }
        .flash-overlay.flash { animation: flashAnim 0.7s ease-out; }
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ============================================================
           🎉 CONFETTIS (ticket valide)
           ============================================================ */
        .confetti-container {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 99996;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall 3s linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .scan-toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: white; border-radius: 16px; padding: 14px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); z-index: 99999;
            min-width: 280px; max-width: calc(100% - 40px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 5px solid var(--success);
            display: flex; align-items: center; gap: 12px;
        }
        .scan-toast.show { transform: translateX(-50%) translateY(0); }
        .scan-toast.error { border-left-color: var(--danger); }
        .scan-toast.warning { border-left-color: var(--warning); }
        .scan-toast.info { border-left-color: #3b82f6; }
        .scan-toast .toast-icon { font-size: 1.5rem; color: var(--success); flex-shrink: 0; }
        .scan-toast.error .toast-icon { color: var(--danger); }
        .scan-toast.warning .toast-icon { color: var(--warning); }
        .scan-toast.info .toast-icon { color: #3b82f6; }
        .scan-toast .toast-title { font-weight: 700; font-size: 0.9rem; color: var(--dark); margin-bottom: 2px; }
        .scan-toast .toast-message { font-size: 0.8rem; color: var(--gray); }

        /* ============================================================
           📊 MODAL HISTORIQUE
           ============================================================ */
        .history-modal {
            position: fixed; inset: 0;
            background: rgba(10, 15, 30, 0.97);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100000;
            display: none; flex-direction: column;
            animation: fadeIn 0.25s ease;
        }
        .history-modal.show { display: flex; }

        .history-header {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid rgba(245,180,0,0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .history-header h2 {
            color: white; font-size: 1.1rem; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .history-header h2 i { color: var(--accent); }
        .history-header .close-history {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.25s ease;
        }
        .history-header .close-history:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .history-filters {
            padding: 16px 20px 10px;
            display: flex; gap: 8px; flex-wrap: wrap;
            align-items: center; flex-shrink: 0;
        }
        .history-search { flex: 1; min-width: 200px; position: relative; }
        .history-search i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: #6b7280; font-size: 0.9rem;
        }
        .history-search input {
            width: 100%; padding: 10px 14px 10px 40px;
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: white;
            font-size: 0.85rem; font-family: inherit; transition: all 0.25s;
        }
        .history-search input:focus {
            outline: none; border-color: var(--accent);
            background: rgba(255,255,255,0.1);
        }
        .history-search input::placeholder { color: #8892b0; }

        .history-filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .history-filter-btns button {
            padding: 8px 14px; border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.15);
            background: transparent; color: #a0b4cc;
            font-size: 0.75rem; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            font-family: inherit; white-space: nowrap;
        }
        .history-filter-btns button.active {

<script>
// ============================================================
// CONFIGURATION SUPABASE
// ============================================================
const SUPABASE_URL = "https://tycebwzgsujiazgopkri.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5Y2Vid3pnc3VqaWF6Z29wa3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODg2NTMsImV4cCI6MjA5Nzk2NDY1M30.7x1rouTbMJE2WcY008vRnqGuAWq3yM_eZCS4Q8_3TrQ";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    db: { schema: 'public' }
});

// ============================================================
// ÉTAT GLOBAL
// ============================================================
let qrScanner = null;
let isScanning = false;
let isProcessing = false;
let currentUser = { wallet: null, piUid: null, name: 'Guest' };
let lastScannedCode = null;
let lastScannedTime = 0;
const SCAN_COOLDOWN = 2000;
let scanStats = { today: 0, total: 0, valid: 0 };
let scanHistory = [];
let currentHistoryFilter = 'all';
let audioCtx = null;

// ============================================================
// INITIALISATION
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    console.log('🎫 Betix Scan - Initialisation');
    loadCurrentUser();
    loadScanStats();
    loadScanHistory();
    updateHistoryBadge();

    if (!currentUser.wallet && !currentUser.piUid) {
        showToast('Non connecté', 'Connectez-vous d\'abord à Betix', 'warning');
        setTimeout(() => { window.location.href = 'index.html'; }, 2500);
        return;
    }

    setTimeout(() => {
        document.getElementById('scanLoader').classList.add('hidden');
        setTimeout(() => {
            document.getElementById('scanLoader').style.display = 'none';
        }, 500);
    }, 1200);

    updateStatsUI();
    initQrScanner();
});

// ============================================================
// CHARGER L'UTILISATEUR
// ============================================================
function loadCurrentUser() {
    try {
        const savedUser = localStorage.getItem('betix_user');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            if (userData.wallet || userData.piUid) {
                currentUser = userData;
                console.log('✅ Utilisateur chargé:', currentUser.wallet || currentUser.piUid);
            }
        }
    } catch (e) { console.error('Erreur chargement utilisateur:', e); }
}

// ============================================================
// STATS
// ============================================================
function loadScanStats() {
    try {
        const saved = localStorage.getItem('betix_scan_stats');
        if (saved) {
            const data = JSON.parse(saved);
            const today = new Date().toDateString();
            if (data.date === today) scanStats = data;
            else scanStats = { today: 0, total: data.total || 0, valid: 0, date: today };
        } else {
            scanStats = { today: 0, total: 0, valid: 0, date: new Date().toDateString() };
        }
    } catch (e) {
        scanStats = { today: 0, total: 0, valid: 0, date: new Date().toDateString() };
    }
}

function saveScanStats() {
    scanStats.date = new Date().toDateString();
    localStorage.setItem('betix_scan_stats', JSON.stringify(scanStats));
}

function updateStatsUI() {
    document.getElementById('statToday').textContent = scanStats.today || 0;
    document.getElementById('statTotal').textContent = scanStats.total || 0;
    document.getElementById('statValid').textContent = scanStats.valid || 0;
}

// ============================================================
// HISTORIQUE
// ============================================================
function loadScanHistory() {
    try {
        const saved = localStorage.getItem('betix_scan_history');
        scanHistory = saved ? JSON.parse(saved) : [];
        if (!Array.isArray(scanHistory)) scanHistory = [];
    } catch (e) {
        console.error('Erreur chargement historique:', e);
        scanHistory = [];
    }
}

function saveScanHistory() {
    try {
        if (scanHistory.length > 500) scanHistory = scanHistory.slice(0, 500);
        localStorage.setItem('betix_scan_history', JSON.stringify(scanHistory));
    } catch (e) { console.error('Erreur sauvegarde historique:', e); }
}

function addScanToHistory(entry) {
    scanHistory.unshift({
        id: 'scan_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        timestamp: new Date().toISOString(),
        code: entry.code || '',
        eventTitle: entry.eventTitle || 'N/A',
        buyerName: entry.buyerName || 'N/A',
        buyerEmail: entry.buyerEmail || '',
        ticketType: entry.ticketType || 'standard',
        price: entry.price || 0,
        status: entry.status || 'valid',
        scannedBy: currentUser.wallet || currentUser.piUid || 'Anonyme',
        message: entry.message || ''
    });
    saveScanHistory();
    updateHistoryBadge();
}

function updateHistoryBadge() {
    const badge = document.getElementById('historyBadge');
    if (badge) {
        const today = new Date().toDateString();
        const todayCount = scanHistory.filter(h => new Date(h.timestamp).toDateString() === today).length;
        badge.textContent = todayCount > 99 ? '99+' : todayCount;
        badge.style.display = todayCount > 0 ? 'flex' : 'none';
    }
}

function openHistoryModal() {
    document.getElementById('historyModal').classList.add('show');
    document.body.style.overflow = 'hidden';
    renderHistoryTable();
}
function closeHistoryModal() {
    document.getElementById('historyModal').classList.remove('show');
    document.body.style.overflow = '';
}
function setHistoryFilter(filter) {
    currentHistoryFilter = filter;
    document.querySelectorAll('.history-filter-btns button').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
    });
    renderHistoryTable();
}

function getFilteredHistory() {
    const search = (document.getElementById('historySearchInput')?.value || '').toLowerCase().trim();
    const now = Date.now();
    const oneDayAgo = now - (24 * 60 * 60 * 1000);
    const oneWeekAgo = now - (7 * 24 * 60 * 60 * 1000);

    return scanHistory.filter(h => {
        const ts = new Date(h.timestamp).getTime();
        if (currentHistoryFilter === 'today' && ts < oneDayAgo) return false;
        if (currentHistoryFilter === 'week' && ts < oneWeekAgo) return false;
        if (currentHistoryFilter === 'valid' && h.status !== 'valid') return false;
        if (currentHistoryFilter === 'invalid' && h.status === 'valid') return false;

        if (search) {
            const haystack = [h.code, h.eventTitle, h.buyerName, h.buyerEmail, h.scannedBy].join(' ').toLowerCase();
            if (!haystack.includes(search)) return false;
        }
        return true;
    });
}

function renderHistoryTable() {
    const container = document.getElementById('historyContent');
    if (!container) return;

    const filtered = getFilteredHistory();

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="history-empty">
                <i class="fas fa-inbox"></i>
                <h3>Aucun scan trouvé</h3>
                <p>Scannez un ticket pour le voir apparaître ici.</p>
            </div>`;
        return;
    }

    const statusLabels = {
        valid: { label: 'Valide', class: 'valid', icon: 'fa-check-circle' },
        used: { label: 'Utilisé', class: 'used', icon: 'fa-exclamation-circle' },
        invalid: { label: 'Invalide', class: 'invalid', icon: 'fa-times-circle' },
        expired: { label: 'Expiré', class: 'expired', icon: 'fa-clock' },
        refunded: { label: 'Remboursé', class: 'refunded', icon: 'fa-undo' }
    };

    let rows = filtered.map(h => {
        const date = new Date(h.timestamp);
        const dateStr = date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
        const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        const st = statusLabels[h.status] || statusLabels.valid;
        const codeShort = h.code.length > 20 ? h.code.substring(0, 18) + '…' : h.code;
        const buyer = h.buyerName.length > 18 ? h.buyerName.substring(0, 16) + '…' : h.buyerName;
        const event = h.eventTitle.length > 20 ? h.eventTitle.substring(0, 18) + '…' : h.eventTitle;

        return `
            <tr onclick="showDetailModal('${h.id}')">
                <td>
                    <div style="font-weight:600;color:#fff;">${dateStr}</div>
                    <div style="font-size:0.68rem;color:#8892b0;">${timeStr}</div>
                </td>
                <td style="font-family:monospace;font-size:0.7rem;color:#a0b4cc;">${escapeHtml(codeShort)}</td>
                <td style="color:#fff;">${escapeHtml(event)}</td>
                <td>${escapeHtml(buyer)}</td>
                <td style="text-transform:uppercase;font-size:0.65rem;color:#a0b4cc;font-weight:600;">${escapeHtml(h.ticketType)}</td>
                <td>
                    <span class="status-badge ${st.class}">
                        <i class="fas ${st.icon}"></i> ${st.label}
                    </span>
                </td>
                <td style="font-size:0.7rem;color:#8892b0;">${escapeHtml(h.scannedBy)}</td>
            </tr>`;
    }).join('');

    container.innerHTML = `
        <div class="history-table-wrapper">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Code</th>
                        <th>Événement</th>
                        <th>Acheteur</th>
                        <th>Type</th>
                        <th>Statut</th>
                        <th>Scanné par</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

function showDetailModal(scanId) {
    const entry = scanHistory.find(h => h.id === scanId);
    if (!entry) return;

    const date = new Date(entry.timestamp);
    const statusLabels = {
        valid: 'Valide', used: 'Déjà utilisé',
        invalid: 'Invalide', expired: 'Expiré', refunded: 'Remboursé'
    };

    document.getElementById('detailBody').innerHTML = `
        <div class="detail-row"><span class="label">Date & heure</span><span class="value">${date.toLocaleString('fr-FR')}</span></div>
        <div class="detail-row"><span class="label">Code ticket</span><span class="value" style="font-family:monospace;font-size:0.78rem;">${escapeHtml(entry.code)}</span></div>
        <div class="detail-row"><span class="label">Événement</span><span class="value">${escapeHtml(entry.eventTitle)}</span></div>
        <div class="detail-row"><span class="label">Acheteur</span><span class="value">${escapeHtml(entry.buyerName)}</span></div>
        <div class="detail-row"><span class="label">Email</span><span class="value">${escapeHtml(entry.buyerEmail || 'N/A')}</span></div>
        <div class="detail-row"><span class="label">Type</span><span class="value" style="text-transform:uppercase;">${escapeHtml(entry.ticketType)}</span></div>
        <div class="detail-row"><span class="label">Prix</span><span class="value">${Number(entry.price).toFixed(6)} Pi</span></div>
        <div class="detail-row"><span class="label">Statut</span><span class="value">${statusLabels[entry.status] || entry.status}</span></div>
        <div class="detail-row"><span class="label">Scanné par</span><span class="value">${escapeHtml(entry.scannedBy)}</span></div>
        ${entry.message ? `<div class="detail-row"><span class="label">Message</span><span class="value">${escapeHtml(entry.message)}</span></div>` : ''}
    `;
    document.getElementById('detailModal').classList.add('show');
}

function closeDetailModal() {
    document.getElementById('detailModal').classList.remove('show');
}

function exportHistoryCSV() {
    const filtered = getFilteredHistory();
    if (filtered.length === 0) {
        showToast('Export', 'Aucun scan à exporter.', 'info');
        return;
    }
    const rows = [['Date', 'Heure', 'Code', 'Événement', 'Acheteur', 'Email', 'Type', 'Prix (Pi)', 'Statut', 'Scanné par']];
    filtered.forEach(h => {
        const d = new Date(h.timestamp);
        rows.push([
            d.toLocaleDateString('fr-FR'), d.toLocaleTimeString('fr-FR'),
            h.code, h.eventTitle, h.buyerName, h.buyerEmail,
            h.ticketType, Number(h.price).toFixed(6), h.status, h.scannedBy
        ]);
    });
    const csv = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'betix_scan_history_' + Date.now() + '.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 0);
    showToast('Export réussi', filtered.length + ' scan(s) exporté(s).', 'success');
}

function clearHistory() {
    if (!confirm('Voulez-vous vraiment vider tout l\'historique des scans ?')) return;
    scanHistory = [];
    saveScanHistory();
    updateHistoryBadge();
    renderHistoryTable();
    showToast('Historique vidé', 'Tous les scans ont été supprimés.', 'success');
}

// ============================================================
// SCANNER QR
// ============================================================
function initQrScanner() {
    if (typeof Html5Qrcode === 'undefined') return;
    qrScanner = new Html5Qrcode("qr-reader", {
        verbose: false,
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });
}

async function toggleScanner() {
    const btn = document.getElementById('startBtn');
    if (isScanning) { await stopScanner(); return; }
    if (!qrScanner) { showToast('Erreur', 'Scanner non disponible', 'error'); return; }

    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        disableFlip: false
    };

    try {
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Démarrage...';
        btn.disabled = true;
        await qrScanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
        );
        isScanning = true;
        btn.innerHTML = '<i class="fas fa-stop"></i> Arrêter la caméra';
        btn.classList.add('stop');
        btn.disabled = false;
        updateScannerStatus(true);
    } catch (err) {
        console.error('❌ Erreur démarrage caméra:', err);
        btn.innerHTML = '<i class="fas fa-play"></i> Démarrer la caméra';
        btn.classList.remove('stop');
        btn.disabled = false;
        showToast('Caméra indisponible', 'Utilisez la saisie manuelle', 'error');
    }
}

async function stopScanner() {
    if (!qrScanner || !isScanning) return;
    try {
        await qrScanner.stop();
        isScanning = false;
        const btn = document.getElementById('startBtn');
        btn.innerHTML = '<i class="fas fa-play"></i> Démarrer la caméra';
        btn.classList.remove('stop');
        updateScannerStatus(false);
    } catch (err) { console.error('Erreur arrêt scanner:', err); }
}

function updateScannerStatus(online) {
    const status = document.getElementById('scannerStatus');
    const text = status.querySelector('span:last-child');
    if (online) { status.classList.remove('offline'); text.textContent = 'Scan actif'; }
    else { status.classList.add('offline'); text.textContent = 'Prêt'; }
}

function onScanSuccess(decodedText) {
    if (isProcessing) return;
    const now = Date.now();
    if (decodedText === lastScannedCode && (now - lastScannedTime) < SCAN_COOLDOWN) return;
    lastScannedCode = decodedText;
    lastScannedTime = now;
    vibrate([50, 30, 50]);
    playScanBeep();
    processTicketCode(decodedText);
}

function onScanError() { /* silencieux */ }

function toggleManualInput() {
    const section = document.getElementById('manualInputSection');
    section.classList.toggle('show');
    if (section.classList.contains('show')) {
        setTimeout(() => document.getElementById('manualCodeInput').focus(), 100);
    }
}

function validateManualCode() {
    const input = document.getElementById('manualCodeInput');
    const code = input.value.trim();
    if (!code) { showToast('Erreur', 'Veuillez saisir un code', 'warning'); return; }
    input.value = '';
    processTicketCode(code);
}

// ============================================================
// 🎬 OVERLAY D'ANALYSE + PROGRESSION
// ============================================================
const ANALYSIS_STEPS = [
    { text: 'Analyse du ticket...', icon: 'fa-circle-notch', progress: 20 },
    { text: 'Lecture des données...', icon: 'fa-database', progress: 45 },
    { text: 'Vérification du statut...', icon: 'fa-shield-alt', progress: 70 },
    { text: 'Validation finale...', icon: 'fa-check-double', progress: 95 }
];

let analysisInterval = null;
let currentStepIndex = 0;

function showScanningOverlay() {
    isProcessing = true;
    currentStepIndex = 0;
    const overlay = document.getElementById('scanningOverlay');
    const progressBar = document.getElementById('scanProgressBar');
    const percentEl = document.getElementById('scanPercent');
    const textEl = document.getElementById('analysisText');

    overlay.classList.add('show');
    progressBar.style.width = '0%';
    percentEl.textContent = '0%';

    const updateStep = () => {
        const step = ANALYSIS_STEPS[currentStepIndex];
        textEl.innerHTML = `<i class="fas ${step.icon}"></i><span>${step.text}</span>`;
        progressBar.style.width = step.progress + '%';
        percentEl.textContent = step.progress + '%';
    };
    updateStep();

    analysisInterval = setInterval(() => {
        currentStepIndex++;
        if (currentStepIndex < ANALYSIS_STEPS.length) {
            updateStep();
        }
    }, 500);

    // Durée minimale d'affichage : 2.2s pour un effet pro
    return new Promise(resolve => setTimeout(resolve, 2200));
}

function hideScanningOverlay() {
    if (analysisInterval) { clearInterval(analysisInterval); analysisInterval = null; }
    const overlay = document.getElementById('scanningOverlay');
    const progressBar = document.getElementById('scanProgressBar');
    const percentEl = document.getElementById('scanPercent');
    progressBar.style.width = '100%';
    percentEl.textContent = '100%';
    setTimeout(() => {
        overlay.classList.remove('show');
        isProcessing = false;
    }, 300);
}

// ============================================================
// 🔊 SONS
// ============================================================
function getAudioCtx() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playTone(freq, duration, delay = 0, volume = 0.15, type = 'sine') {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type;
        osc.frequency.value = freq;
        const startTime = ctx.currentTime + delay;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.05);
    } catch(e) {}
}

function playScanBeep() {
    playTone(1400, 0.08, 0, 0.06, 'sine');
}

function playSuccessSound() {
    // Mélodie ascendante harmonieuse (C-E-G-C)
    playTone(523.25, 0.15, 0, 0.18, 'sine');
    playTone(659.25, 0.15, 0.12, 0.18, 'sine');
    playTone(783.99, 0.18, 0.24, 0.20, 'sine');
    playTone(1046.50, 0.30, 0.40, 0.22, 'sine');
}

function playErrorSound() {
    // Deux buzzers graves courts
    playTone(180, 0.18, 0, 0.22, 'square');
    playTone(140, 0.30, 0.22, 0.22, 'square');
}

function playWarningSound() {
    playTone(440, 0.15, 0, 0.15, 'triangle');
    playTone(440, 0.15, 0.20, 0.15, 'triangle');
}

function playExpiredSound() {
    playTone(300, 0.20, 0, 0.15, 'sawtooth');
    playTone(200, 0.35, 0.25, 0.15, 'sawtooth');
}

function playRefundedSound() {
    playTone(660, 0.15, 0, 0.12, 'sine');
    playTone(550, 0.20, 0.18, 0.12, 'sine');
}

// ============================================================
function triggerFlash(color) {
    const overlay = document.getElementById('flashOverlay');
    overlay.classList.remove('green', 'red', 'flash');
    void overlay.offsetWidth;
    overlay.classList.add(color, 'flash');
}

function launchConfetti() {
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    const colors = ['#F5B400', '#10b981', '#0B1F5C', '#ffffff', '#D89C00', '#34d399'];
    for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        if (Math.random() > 0.5) piece.style.borderRadius = '50%';
        container.appendChild(piece);
    }
    setTimeout(() => { container.innerHTML = ''; }, 4000);
}

// ============================================================
// TRAITEMENT PRINCIPAL
// ============================================================
async function processTicketCode(code) {
    if (isProcessing) return;

    const startTime = Date.now();
    const overlayPromise = showScanningOverlay();

    try {
        const { data, error } = await supabaseClient
            .from('tickets').select('*').eq('id', code).maybeSingle();

        let ticketData = data;
        let foundByQr = false;

        if (error || !data) {
            const { data: data2, error: error2 } = await supabaseClient
                .from('tickets').select('*').eq('qr_code', code).maybeSingle();
            if (!error2 && data2) { ticketData = data2; foundByQr = true; }
        }

        // Attendre au moins 2.2s pour l'animation
        await overlayPromise;

        if (!ticketData) {
            scanStats.total++;
            saveScanStats();
            updateStatsUI();
            addScanToHistory({
                code, eventTitle: 'N/A', buyerName: 'N/A',
                status: 'invalid', message: 'Ticket introuvable'
            });
            hideScanningOverlay();
            setTimeout(() => {
                playErrorSound();
                vibrate([200, 100, 200, 100, 200]);
                triggerFlash('red');
                showResult('invalid', '❌ Ticket introuvable', 'Ce ticket n\'existe pas dans le système', {
                    'Code scanné': code
                });
            }, 350);
            return;
        }

        hideScanningOverlay();
        setTimeout(() => handleTicketData(ticketData), 350);

    } catch (err) {
        console.error('Erreur traitement:', err);
        await overlayPromise;
        hideScanningOverlay();
        addScanToHistory({
            code, eventTitle: 'N/A', buyerName: 'N/A',
            status: 'invalid', message: 'Erreur de connexion'
        });
        setTimeout(() => {
            playErrorSound();
            vibrate([200, 100, 200]);
            triggerFlash('red');
            showResult('invalid', '❌ Erreur de connexion', 'Impossible de vérifier le ticket', {
                'Code scanné': code
            });
        }, 350);
    }
}

async function handleTicketData(ticket) {
    scanStats.total++;
    saveScanStats();

    const status = (ticket.status || 'Valid').toLowerCase();

    // ========== DÉJÀ UTILISÉ ==========
    if (status === 'used') {
        updateStatsUI();
        addScanToHistory({
            code: ticket.id, eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A', buyerEmail: ticket.buyer_email || '',
            ticketType: ticket.ticket_type || 'standard', price: ticket.price || 0,
            status: 'used', message: 'Déjà utilisé'
        });
        playWarningSound();
        vibrate([100, 50, 100, 50, 100]);
        triggerFlash('red');
        showResult('used', '⚠️ Ticket déjà utilisé', 'Ce ticket a déjà été scanné', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Type': (ticket.ticket_type || 'standard').toUpperCase(),
            'Utilisé le': ticket.used_at ? new Date(ticket.used_at).toLocaleString('fr-FR') : 'Inconnu'
        });
        return;
    }

    // ========== EXPIRÉ ==========
    if (status === 'expired') {
        updateStatsUI();
        addScanToHistory({
            code: ticket.id, eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A', ticketType: ticket.ticket_type || 'standard',
            price: ticket.price || 0, status: 'expired', message: 'Ticket expiré'
        });
        playExpiredSound();
        vibrate([150, 80, 150]);
        triggerFlash('red');
        showResult('expired', '⏰ Ticket expiré', 'Ce ticket a dépassé sa date de validité', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Date expiration': ticket.expiration_date ? new Date(ticket.expiration_date).toLocaleString('fr-FR') : 'N/A'
        });
        return;
    }

    // ========== REMBOURSÉ ==========
    if (status === 'refunded' || ticket.refunded) {
        updateStatsUI();
        addScanToHistory({
            code: ticket.id, eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A', ticketType: ticket.ticket_type || 'standard',
            price: ticket.price || 0, status: 'refunded', message: 'Ticket remboursé'
        });
        playRefundedSound();
        vibrate([100, 50, 100]);
        triggerFlash('red');
        showResult('refunded', '↩️ Ticket remboursé', 'Ce ticket a été remboursé et n\'est plus valide', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Montant': (parseFloat(ticket.price) || 0).toFixed(6) + ' Pi'
        });
        return;
    }

    // ========== VÉRIFIER ORGANISATEUR ==========
    const userId = currentUser.piUid || currentUser.wallet;
    const organizerId = ticket.organizer_pi_uid || ticket.organizer_uid;
    if (organizerId && String(organizerId) !== String(userId)) {
        const isAdmin = localStorage.getItem('betix_admin_password') !== null;
        if (!isAdmin) {
            updateStatsUI();
            addScanToHistory({
                code: ticket.id, eventTitle: ticket.event_title || 'N/A',
                buyerName: ticket.buyer_name || 'N/A', ticketType: ticket.ticket_type || 'standard',
                price: ticket.price || 0, status: 'invalid', message: 'Non organisateur'
            });
            playErrorSound();
            vibrate([200, 100, 200, 100, 200]);
            triggerFlash('red');
            showResult('invalid', '❌ Accès refusé', 'Vous n\'êtes pas l\'organisateur de cet événement', {
                'Événement': ticket.event_title || 'N/A',
                'Organisateur': ticket.organizer_name || 'N/A'
            });
            return;
        }
    }

    // ========== VÉRIFIER DATE ==========
    const eventDate = ticket.event_date || ticket.purchase_date;
    if (eventDate) {
        const eventEnd = new Date(eventDate);
        const duration = parseFloat(ticket.duration_value) || 3;
        switch (ticket.duration_unit) {
            case 'hours': eventEnd.setHours(eventEnd.getHours() + duration); break;
            case 'days': eventEnd.setDate(eventEnd.getDate() + duration); break;
            case 'weeks': eventEnd.setDate(eventEnd.getDate() + duration * 7); break;
            default: eventEnd.setHours(eventEnd.getHours() + 3);
        }
        if (Date.now() > eventEnd.getTime() + (24 * 60 * 60 * 1000)) {
            updateStatsUI();
            addScanToHistory({
                code: ticket.id, eventTitle: ticket.event_title || 'N/A',
                buyerName: ticket.buyer_name || 'N/A', ticketType: ticket.ticket_type || 'standard',
                price: ticket.price || 0, status: 'expired', message: 'Événement terminé'
            });
            playExpiredSound();
            vibrate([150, 80, 150]);
            triggerFlash('red');
            showResult('expired', '⏰ Événement terminé', 'La date de l\'événement est dépassée', {
                'Événement': ticket.event_title || 'N/A',
                'Date': new Date(eventDate).toLocaleString('fr-FR')
            });
            return;
        }
    }

    // ========== ✅ VALIDE ==========
    await markTicketAsUsed(ticket);
}

async function markTicketAsUsed(ticket) {
    const now = new Date().toISOString();

    try {
        const { error } = await supabaseClient
            .from('tickets')
            .update({
                status: 'Used',
                used_at: now,
                scanned_by: currentUser.piUid || currentUser.wallet,
                updated_at: now
            })
            .eq('id', ticket.id);

        if (error) {
            console.error('Erreur update Supabase:', error);
            showToast('Erreur', 'Impossible de marquer le ticket', 'error');
            playErrorSound();
            vibrate([200, 100, 200]);
            return;
        }

        scanStats.valid++;
        saveScanStats();
        updateStatsUI();

        addScanToHistory({
            code: ticket.id, eventTitle: ticket.event_title || 'N/A',
            buyerName: ticket.buyer_name || 'N/A', buyerEmail: ticket.buyer_email || '',
            ticketType: ticket.ticket_type || 'standard', price: ticket.price || 0,
            status: 'valid', message: 'Accès autorisé'
        });

        // 🎉 FÉLICITATIONS
        playSuccessSound();
        vibrate([50, 30, 50, 30, 100]);
        triggerFlash('green');
        launchConfetti();

        showResult('valid', '✅ Ticket valide', 'Accès autorisé — Bonne expérience !', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Email': ticket.buyer_email || 'N/A',
            'Téléphone': ticket.buyer_phone || 'N/A',
            'Type de ticket': (ticket.ticket_type || 'standard').toUpperCase(),
            'Prix': (parseFloat(ticket.price) || 0).toFixed(6) + ' Pi',
            'N° Ticket': ticket.ticket_number || 'N/A',
            'Scanné le': new Date(now).toLocaleString('fr-FR')
        });

    } catch (err) {
        console.error('Erreur marquage:', err);
        playErrorSound();
        vibrate([200, 100, 200]);
        showToast('Erreur', 'Erreur lors du marquage', 'error');
    }
}

    banner.className = 'result-banner ' + type;

    if (isScanning) await stopScanner();

// ============================================================
// UTILITAIRES
// ============================================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#39;';
        return m;
    });
}

function vibrate(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
    }
}

// ============================================================
// TOAST
// ============================================================
let toastTimeout = null;
function showToast(title, message, type = 'success', duration = 3000) {
    const toast = document.getElementById('scanToast');
    const icon = document.getElementById('toastIcon');
    toast.className = 'scan-toast ' + type;
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-times-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    icon.className = 'fas ' + (icons[type] || 'fa-info-circle') + ' toast-icon';
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMessage').textContent = message;
    toast.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), duration);
}

// NETTOYAGE
// ============================================================
window.addEventListener('beforeunload', async () => {
    if (isScanning && qrScanner) {
        try { await qrScanner.stop(); } catch (e) {}
    }
});
