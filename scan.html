<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Betix - Scan Ticket</title>
    <meta name="description" content="Scannez et validez les tickets Betix" />

    <!-- Polices & icônes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Bibliothèques -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0B1F5C;
            --primary-light: #1a2a4a;
            --accent: #F5B400;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray: #6b7280;
            --gray-light: #e6e6e6;
            --dark: #1a1a2e;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0f1e;
            color: #1f2937;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .scan-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(245,180,0,0.2);
        }
        .scan-header .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            transition: all 0.25s ease;
        }
        .scan-header .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .scan-header .title {
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex; align-items: center; gap: 8px;
        }
        .scan-header .title i {
            color: var(--accent);
        }
        .scan-header .header-action {
            background: rgba(245,180,0,0.15);
            border: 1px solid rgba(245,180,0,0.3);
            color: var(--accent);
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            transition: all 0.25s ease;
        }
        .scan-header .header-action:hover {
            background: rgba(245,180,0,0.3);
        }

        /* ============================================================
           MAIN
           ============================================================ */
        .scan-main {
            padding: 80px 16px 30px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* ============================================================
           STATS
           ============================================================ */
        .scan-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-mini {
            background: linear-gradient(135deg, #131c33, #0B1F5C);
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(245,180,0,0.15);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .stat-mini .num {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.2;
        }
        .stat-mini .label {
            font-size: 0.65rem;
            color: #a0b4cc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* ============================================================
           SCANNER
           ============================================================ */
        .scanner-card {
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            border: 1px solid rgba(245,180,0,0.15);
        }
        .scanner-header {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }
        .scanner-header .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .scanner-header .status .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }
        .scanner-header .status.offline .dot {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            animation: none;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        .scanner-header h3 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        #qr-reader {
            width: 100%;
            background: #000;
            position: relative;
            aspect-ratio: 1 / 1;
        }
        #qr-reader video {
            border-radius: 0 !important;
            object-fit: cover !important;
        }
        #qr-reader__scan_region {
            background: transparent !important;
        }
        #qr-reader__scan_region img {
            display: none !important;
        }
        #qr-reader__dashboard {
            background: #0B1F5C !important;
            color: white !important;
        }
        #qr-reader__dashboard_section_csr button {
            background: var(--accent) !important;
            color: #0B1F5C !important;
            border: none !important;
            padding: 8px 16px !important;
            border-radius: 20px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
        }

        .scanner-actions {
            display: flex;
            gap: 10px;
            padding: 16px;
            background: #f8fafc;
        }
        .scanner-actions button {
            flex: 1;
            padding: 12px 16px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-camera {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            color: white;
            box-shadow: 0 4px 16px rgba(11,31,92,0.3);
        }
        .btn-camera:hover { transform: translateY(-2px); }
        .btn-camera.stop {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
        }
        .btn-manual {
            background: white;
            color: #0B1F5C;
            border: 2px solid #e6e6e6;
        }
        .btn-manual:hover { border-color: var(--accent); }

        /* ============================================================
           MANUAL INPUT
           ============================================================ */
        .manual-input-section {
            display: none;
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid #e6e6e6;
        }
        .manual-input-section.show { display: block; }
        .manual-input-section label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .manual-input-group {
            display: flex;
            gap: 8px;
        }
        .manual-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e6e6e6;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: 'Poppins', monospace;
            transition: all 0.25s;
            background: white;
        }
        .manual-input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(245,180,0,0.15);
        }
        .manual-input-group button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #0B1F5C;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
        }
        .manual-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245,180,0,0.4);
        }

        /* ============================================================
           RESULT DISPLAY
           ============================================================ */
        .result-card {
            display: none;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            margin-top: 20px;
            border: 1px solid rgba(245,180,0,0.15);
            animation: resultPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-card.show { display: block; }
        @keyframes resultPop {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .result-banner {
            padding: 24px 20px;
            text-align: center;
            color: white;
        }
        .result-banner.valid { background: linear-gradient(135deg, #10b981, #059669); }
        .result-banner.invalid { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .result-banner.used { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .result-banner.expired { background: linear-gradient(135deg, #6b7280, #4b5563); }
        .result-banner.refunded { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .result-banner .icon {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            font-size: 2rem;
            animation: iconPop 0.5s ease;
        }
        @keyframes iconPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .result-banner h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0 0 6px;
        }
        .result-banner p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin: 0;
        }
        .result-body {
            padding: 20px;
        }
        .result-info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px 16px;
        }
        .result-info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #e6e6e6;
            font-size: 0.85rem;
        }
        .result-info-row:last-child { border-bottom: none; }
        .result-info-row .label {
            color: var(--gray);
            font-weight: 500;
        }
        .result-info-row .value {
            color: var(--dark);
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .result-actions {
            display: flex;
            gap: 10px;
            padding: 16px 20px 20px;
        }
        .result-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-scan-again {
            background: linear-gradient(135deg, #0B1F5C, #1a2a4a);
            color: white;
            box-shadow: 0 4px 16px rgba(11,31,92,0.3);
        }
        .btn-scan-again:hover { transform: translateY(-2px); }
        .btn-close-result {
            background: #f3f4f6;
            color: var(--dark);
        }
        .btn-close-result:hover { background: #e5e7eb; }

        /* ============================================================
           LOADER
           ============================================================ */
        .scan-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 40%, #0B1F5C 0%, #060b1a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
            gap: 24px;
        }
        .scan-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .scan-loader-spinner {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 4px solid rgba(245,180,0,0.2);
            border-top-color: var(--accent);
            animation: spinnerRotate 1s linear infinite;
        }
        @keyframes spinnerRotate {
            to { transform: rotate(360deg); }
        }
        .scan-loader-text {
            color: white;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            animation: fadeText 1.5s ease-in-out infinite;
        }
        @keyframes fadeText {
            0%,100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .scan-loader-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: white;
            letter-spacing: 2px;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .scan-loader-logo span {
            color: var(--accent);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .scan-toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: white;
            border-radius: 16px;
            padding: 14px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            z-index: 99999;
            min-width: 280px;
            max-width: calc(100% - 40px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 5px solid var(--success);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .scan-toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .scan-toast.error { border-left-color: var(--danger); }
        .scan-toast.warning { border-left-color: var(--warning); }
        .scan-toast.info { border-left-color: #3b82f6; }
        .scan-toast .toast-icon {
            font-size: 1.5rem;
            color: var(--success);
            flex-shrink: 0;
        }
        .scan-toast.error .toast-icon { color: var(--danger); }
        .scan-toast.warning .toast-icon { color: var(--warning); }
        .scan-toast.info .toast-icon { color: #3b82f6; }
        .scan-toast .toast-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--dark);
            margin-bottom: 2px;
        }
        .scan-toast .toast-message {
            font-size: 0.8rem;
            color: var(--gray);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .scan-main { padding: 76px 12px 20px; }
            .stat-mini .num { font-size: 1.3rem; }
            .result-banner h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<!-- ============================================================ -->
<!-- LOADER                                                        -->
<!-- ============================================================ -->
<div id="scanLoader" class="scan-loader">
    <div class="scan-loader-logo">Betix<span>.</span></div>
    <div class="scan-loader-spinner"></div>
    <div class="scan-loader-text">Préparation du scanner...</div>
</div>

<!-- ============================================================ -->
<!-- HEADER                                                        -->
<!-- ============================================================ -->
<header class="scan-header">
    <button class="back-btn" onclick="goBack()" title="Retour">
        <i class="fas fa-arrow-left"></i>
    </button>
    <div class="title">
        <i class="fas fa-qrcode"></i>
        Scan Ticket
    </div>
    <button class="header-action" onclick="showHistory()" title="Historique">
        <i class="fas fa-history"></i>
    </button>
</header>

<!-- ============================================================ -->
<!-- MAIN                                                          -->
<!-- ============================================================ -->
<main class="scan-main">

    <!-- STATS -->
    <div class="scan-stats">
        <div class="stat-mini">
            <div class="num" id="statToday">0</div>
            <div class="label">Aujourd'hui</div>
        </div>
        <div class="stat-mini">
            <div class="num" id="statTotal">0</div>
            <div class="label">Total scannés</div>
        </div>
        <div class="stat-mini">
            <div class="num" id="statValid">0</div>
            <div class="label">Valides</div>
        </div>
    </div>

    <!-- SCANNER -->
    <div class="scanner-card">
        <div class="scanner-header">
            <h3><i class="fas fa-camera"></i> Scanner QR Code</h3>
            <div class="status" id="scannerStatus">
                <span class="dot"></span>
                <span>Prêt</span>
            </div>
        </div>
        <div id="qr-reader"></div>
        <div class="scanner-actions">
            <button class="btn-camera" id="startBtn" onclick="toggleScanner()">
                <i class="fas fa-play"></i> Démarrer la caméra
            </button>
            <button class="btn-manual" onclick="toggleManualInput()">
                <i class="fas fa-keyboard"></i> Saisir
            </button>
        </div>
        <div class="manual-input-section" id="manualInputSection">
            <label>Code du ticket (QR Code ID)</label>
            <div class="manual-input-group">
                <input type="text" id="manualCodeInput" placeholder="Ex: 1698765432-1-a3b4" autocomplete="off">
                <button onclick="validateManualCode()">
                    <i class="fas fa-check"></i> Valider
                </button>
            </div>
        </div>
    </div>

    <!-- RÉSULTAT -->
    <div class="result-card" id="resultCard">
        <div class="result-banner" id="resultBanner">
            <div class="icon" id="resultIcon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 id="resultTitle">Ticket valide</h2>
            <p id="resultSubtitle">Accès autorisé</p>
        </div>
        <div class="result-body">
            <div class="result-info-grid" id="resultInfoGrid"></div>
        </div>
        <div class="result-actions">
            <button class="btn-close-result" onclick="closeResult()">
                <i class="fas fa-times"></i> Fermer
            </button>
            <button class="btn-scan-again" onclick="scanAgain()">
                <i class="fas fa-qrcode"></i> Scanner à nouveau
            </button>
        </div>
    </div>

</main>

<!-- ============================================================ -->
<!-- TOAST                                                         -->
<!-- ============================================================ -->
<div class="scan-toast" id="scanToast">
    <i class="fas fa-check-circle toast-icon" id="toastIcon"></i>
    <div>
        <div class="toast-title" id="toastTitle">Succès</div>
        <div class="toast-message" id="toastMessage">Message</div>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPTS                                                       -->
<!-- ============================================================ -->
<script>
// ============================================================
// CONFIGURATION SUPABASE (identique à script.js)
// ============================================================
const SUPABASE_URL = "https://tycebwzgsujiazgopkri.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5Y2Vid3pnc3VqaWF6Z29wa3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODg2NTMsImV4cCI6MjA5Nzk2NDY1M30.7x1rouTbMJE2WcY008vRnqGuAWq3yM_eZCS4Q8_3TrQ";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    db: { schema: 'public' }
});

// ============================================================
// ÉTAT GLOBAL
// ============================================================
let qrScanner = null;
let isScanning = false;
let currentUser = { wallet: null, piUid: null, name: 'Guest' };
let lastScannedCode = null;
let lastScannedTime = 0;
const SCAN_COOLDOWN = 2000; // 2 secondes anti-doublon
let scanStats = {
    today: 0,
    total: 0,
    valid: 0
};

// ============================================================
// INITIALISATION
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    console.log('🎫 Betix Scan - Initialisation');

    // Charger l'utilisateur depuis localStorage
    loadCurrentUser();
    loadScanStats();

    // Vérifier la connexion
    if (!currentUser.wallet && !currentUser.piUid) {
        showToast('Non connecté', 'Connectez-vous d\'abord à Betix', 'warning');
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2500);
        return;
    }

    // Masquer le loader après un délai
    setTimeout(() => {
        document.getElementById('scanLoader').classList.add('hidden');
        setTimeout(() => {
            document.getElementById('scanLoader').style.display = 'none';
        }, 500);
    }, 1200);

    // Afficher les stats
    updateStatsUI();

    // Initialiser le scanner QR (mais ne pas démarrer)
    initQrScanner();
});

// ============================================================
// CHARGER L'UTILISATEUR
// ============================================================
function loadCurrentUser() {
    try {
        const savedUser = localStorage.getItem('betix_user');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            if (userData.wallet || userData.piUid) {
                currentUser = userData;
                console.log('✅ Utilisateur chargé:', currentUser.wallet || currentUser.piUid);
            }
        }
    } catch (e) {
        console.error('Erreur chargement utilisateur:', e);
    }
}

// ============================================================
// CHARGER / SAUVEGARDER STATS
// ============================================================
function loadScanStats() {
    try {
        const saved = localStorage.getItem('betix_scan_stats');
        if (saved) {
            const data = JSON.parse(saved);
            const today = new Date().toDateString();
            if (data.date === today) {
                scanStats = data;
            } else {
                scanStats = { today: 0, total: data.total || 0, valid: 0, date: today };
            }
        } else {
            scanStats = { today: 0, total: 0, valid: 0, date: new Date().toDateString() };
        }
    } catch (e) {
        scanStats = { today: 0, total: 0, valid: 0, date: new Date().toDateString() };
    }
}

function saveScanStats() {
    scanStats.date = new Date().toDateString();
    localStorage.setItem('betix_scan_stats', JSON.stringify(scanStats));
}

function updateStatsUI() {
    document.getElementById('statToday').textContent = scanStats.today || 0;
    document.getElementById('statTotal').textContent = scanStats.total || 0;
    document.getElementById('statValid').textContent = scanStats.valid || 0;
}

// ============================================================
// INITIALISATION DU SCANNER QR
// ============================================================
function initQrScanner() {
    if (typeof Html5Qrcode === 'undefined') {
        console.error('❌ html5-qrcode non chargé');
        return;
    }
    qrScanner = new Html5Qrcode("qr-reader", {
        verbose: false,
        formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
        ]
    });
    console.log('✅ Scanner QR initialisé');
}

// ============================================================
// DÉMARRER / ARRÊTER LE SCANNER
// ============================================================
async function toggleScanner() {
    const btn = document.getElementById('startBtn');

    if (isScanning) {
        await stopScanner();
        return;
    }

    if (!qrScanner) {
        showToast('Erreur', 'Scanner non disponible', 'error');
        return;
    }

    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        disableFlip: false
    };

    try {
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Démarrage...';
        btn.disabled = true;

        await qrScanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
        );

        isScanning = true;
        btn.innerHTML = '<i class="fas fa-stop"></i> Arrêter la caméra';
        btn.classList.add('stop');
        btn.disabled = false;
        updateScannerStatus(true);
        console.log('🎥 Scanner démarré');
    } catch (err) {
        console.error('❌ Erreur démarrage caméra:', err);
        btn.innerHTML = '<i class="fas fa-play"></i> Démarrer la caméra';
        btn.classList.remove('stop');
        btn.disabled = false;
        showToast('Caméra indisponible', 'Utilisez la saisie manuelle', 'error');
    }
}

async function stopScanner() {
    if (!qrScanner || !isScanning) return;
    try {
        await qrScanner.stop();
        isScanning = false;
        const btn = document.getElementById('startBtn');
        btn.innerHTML = '<i class="fas fa-play"></i> Démarrer la caméra';
        btn.classList.remove('stop');
        updateScannerStatus(false);
        console.log('⏹️ Scanner arrêté');
    } catch (err) {
        console.error('Erreur arrêt scanner:', err);
    }
}

function updateScannerStatus(online) {
    const status = document.getElementById('scannerStatus');
    const text = status.querySelector('span:last-child');
    if (online) {
        status.classList.remove('offline');
        text.textContent = 'Scan actif';
    } else {
        status.classList.add('offline');
        text.textContent = 'Prêt';
    }
}

// ============================================================
// CALLBACKS DU SCANNER
// ============================================================
function onScanSuccess(decodedText) {
    const now = Date.now();

    // Anti-doublon
    if (decodedText === lastScannedCode && (now - lastScannedTime) < SCAN_COOLDOWN) {
        return;
    }
    lastScannedCode = decodedText;
    lastScannedTime = now;

    console.log('🎯 QR Code détecté:', decodedText);
    vibrate([50, 30, 50]);
    beep();
    processTicketCode(decodedText);
}

function onScanError(errorMessage) {
    // Erreur normale quand aucun QR n'est détecté
    // Ne pas spammer la console
}

// ============================================================
// VALIDATION MANUELLE
// ============================================================
function toggleManualInput() {
    const section = document.getElementById('manualInputSection');
    section.classList.toggle('show');
    if (section.classList.contains('show')) {
        setTimeout(() => {
            document.getElementById('manualCodeInput').focus();
        }, 100);
    }
}

function validateManualCode() {
    const input = document.getElementById('manualCodeInput');
    const code = input.value.trim();
    if (!code) {
        showToast('Erreur', 'Veuillez saisir un code', 'warning');
        return;
    }
    input.value = '';
    processTicketCode(code);
}

// ============================================================
// TRAITEMENT PRINCIPAL DU TICKET
// ============================================================
async function processTicketCode(code) {
    showToast('Vérification...', 'Recherche du ticket...', 'info', 1500);

    try {
        // Rechercher le ticket dans Supabase
        const { data, error } = await supabaseClient
            .from('tickets')
            .select('*')
            .eq('id', code)
            .maybeSingle();

        if (error) {
            console.error('Erreur Supabase:', error);
            showResult('invalid', 'Erreur de connexion', 'Impossible de vérifier le ticket', {});
            return;
        }

        if (!data) {
            // Essayer aussi par qr_code
            const { data: data2, error: error2 } = await supabaseClient
                .from('tickets')
                .select('*')
                .eq('qr_code', code)
                .maybeSingle();

            if (error2 || !data2) {
                scanStats.total++;
                saveScanStats();
                updateStatsUI();
                showResult('invalid', 'Ticket introuvable', 'Ce ticket n\'existe pas dans le système', {
                    'Code scanné': code
                });
                vibrate([100, 50, 100, 50, 100]);
                return;
            }
            return handleTicketData(data2);
        }

        return handleTicketData(data);
    } catch (err) {
        console.error('Erreur traitement:', err);
        showResult('invalid', 'Erreur', 'Une erreur est survenue', {});
    }
}

async function handleTicketData(ticket) {
    scanStats.total++;
    saveScanStats();

    // Vérifier le statut
    const status = (ticket.status || 'Valid').toLowerCase();

    // ========== TICKET DÉJÀ UTILISÉ ==========
    if (status === 'used') {
        updateStatsUI();
        vibrate([100, 50, 100]);
        showResult('used', 'Ticket déjà utilisé', 'Ce ticket a déjà été scanné', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Type': (ticket.ticket_type || 'standard').toUpperCase(),
            'Utilisé le': ticket.used_at ? new Date(ticket.used_at).toLocaleString('fr-FR') : 'Inconnu'
        });
        return;
    }

    // ========== TICKET EXPIRÉ ==========
    if (status === 'expired') {
        updateStatsUI();
        vibrate([100, 50, 100]);
        showResult('expired', 'Ticket expiré', 'Ce ticket a dépassé sa date de validité', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Date expiration': ticket.expiration_date ? new Date(ticket.expiration_date).toLocaleString('fr-FR') : 'N/A'
        });
        return;
    }

    // ========== TICKET REMBOURSÉ ==========
    if (status === 'refunded' || ticket.refunded) {
        updateStatsUI();
        vibrate([100, 50, 100]);
        showResult('refunded', 'Ticket remboursé', 'Ce ticket a été remboursé et n\'est plus valide', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Montant': (parseFloat(ticket.price) || 0).toFixed(6) + ' Pi'
        });
        return;
    }

    // ========== VÉRIFIER QUE L'UTILISATEUR EST L'ORGANISATEUR ==========
    const userId = currentUser.piUid || currentUser.wallet;
    const organizerId = ticket.organizer_pi_uid || ticket.organizer_uid;

    if (organizerId && String(organizerId) !== String(userId)) {
        // Vérifier si admin
        const isAdmin = localStorage.getItem('betix_admin_password') !== null;
        if (!isAdmin) {
            updateStatsUI();
            vibrate([100, 50, 100]);
            showResult('invalid', 'Accès refusé', 'Vous n\'êtes pas l\'organisateur de cet événement', {
                'Événement': ticket.event_title || 'N/A',
                'Organisateur': ticket.organizer_name || 'N/A'
            });
            return;
        }
    }

    // ========== VÉRIFIER LA DATE DE L'ÉVÉNEMENT ==========
    const eventDate = ticket.event_date || ticket.purchase_date;
    if (eventDate) {
        const eventEnd = new Date(eventDate);
        const duration = parseFloat(ticket.duration_value) || 3;
        switch (ticket.duration_unit) {
            case 'hours': eventEnd.setHours(eventEnd.getHours() + duration); break;
            case 'days': eventEnd.setDate(eventEnd.getDate() + duration); break;
            case 'weeks': eventEnd.setDate(eventEnd.getDate() + duration * 7); break;
            default: eventEnd.setHours(eventEnd.getHours() + 3);
        }
        if (Date.now() > eventEnd.getTime() + (24 * 60 * 60 * 1000)) {
            updateStatsUI();
            showResult('expired', 'Événement terminé', 'La date de l\'événement est dépassée', {
                'Événement': ticket.event_title || 'N/A',
                'Date': new Date(eventDate).toLocaleString('fr-FR')
            });
            return;
        }
    }

    // ========== ✅ TICKET VALIDE : MARQUER COMME UTILISÉ ==========
    await markTicketAsUsed(ticket);
}

async function markTicketAsUsed(ticket) {
    const now = new Date().toISOString();

    try {
        // Mise à jour Supabase
        const { error } = await supabaseClient
            .from('tickets')
            .update({
                status: 'Used',
                used_at: now,
                scanned_by: currentUser.piUid || currentUser.wallet,
                updated_at: now
            })
            .eq('id', ticket.id);

        if (error) {
            console.error('Erreur update Supabase:', error);
            showToast('Erreur', 'Impossible de marquer le ticket', 'error');
            return;
        }

        // Succès
        scanStats.valid++;
        saveScanStats();
        updateStatsUI();

        vibrate([50, 30, 50, 30, 100]);
        beep();

        showResult('valid', 'Ticket valide ✓', 'Accès autorisé', {
            'Événement': ticket.event_title || 'N/A',
            'Acheteur': ticket.buyer_name || 'N/A',
            'Email': ticket.buyer_email || 'N/A',
            'Téléphone': ticket.buyer_phone || 'N/A',
            'Type de ticket': (ticket.ticket_type || 'standard').toUpperCase(),
            'Prix': (parseFloat(ticket.price) || 0).toFixed(6) + ' Pi',
            'N° Ticket': ticket.ticket_number || 'N/A',
            'Scanné le': new Date(now).toLocaleString('fr-FR')
        });

        console.log('✅ Ticket marqué comme utilisé:', ticket.id);
    } catch (err) {
        console.error('Erreur marquage:', err);
        showToast('Erreur', 'Erreur lors du marquage', 'error');
    }
}

// ============================================================
// AFFICHAGE DU RÉSULTAT
// ============================================================
function showResult(type, title, subtitle, info) {
    const card = document.getElementById('resultCard');
    const banner = document.getElementById('resultBanner');
    const icon = document.getElementById('resultIcon');

    // Classes du banner
    banner.className = 'result-banner ' + type;

    // Icônes
    const icons = {
        valid: 'fa-check-circle',
        invalid: 'fa-times-circle',
        used: 'fa-exclamation-circle',
        expired: 'fa-clock',
        refunded: 'fa-undo'
    };
    icon.innerHTML = '<i class="fas ' + (icons[type] || 'fa-info-circle') + '"></i>';

    // Textes
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultSubtitle').textContent = subtitle;

    // Info grid
    const grid = document.getElementById('resultInfoGrid');
    grid.innerHTML = '';
    Object.keys(info).forEach(key => {
        grid.innerHTML += '<div class="result-info-row">' +
            '<span class="label">' + escapeHtml(key) + '</span>' +
            '<span class="value">' + escapeHtml(String(info[key])) + '</span>' +
        '</div>';
    });

    // Afficher
    card.classList.add('show');

    // Scroll vers le résultat
    setTimeout(() => {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}

function closeResult() {
    document.getElementById('resultCard').classList.remove('show');
}

async function scanAgain() {
    closeResult();
    // Si le scanner tournait, il continue
    if (!isScanning) {
        await toggleScanner();
    }
}

// ============================================================
// HISTORIQUE (placeholder)
// ============================================================
function showHistory() {
    const today = scanStats.today || 0;
    const total = scanStats.total || 0;
    const valid = scanStats.valid || 0;
    const invalid = total - valid;

    showToast(
        'Statistiques',
        'Aujourd\'hui: ' + today + ' | Total: ' + total + ' | Valides: ' + valid + ' | Invalides: ' + invalid,
        'info',
        5000
    );
}

// ============================================================
// NAVIGATION
// ============================================================
async function goBack() {
    if (isScanning) {
        await stopScanner();
    }
    window.location.href = 'index.html';
}

// ============================================================
// UTILITAIRES
// ============================================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#39;';
        return m;
    });
}

function vibrate(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
    }
}

let audioCtx = null;
function beep() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.frequency.value = 1200;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
}

// ============================================================
// TOAST NOTIFICATIONS
// ============================================================
let toastTimeout = null;
function showToast(title, message, type = 'success', duration = 3000) {
    const toast = document.getElementById('scanToast');
    const icon = document.getElementById('toastIcon');

    toast.className = 'scan-toast ' + type;

    const icons = {
        success: 'fa-check-circle',
        error: 'fa-times-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    icon.className = 'fas ' + (icons[type] || 'fa-info-circle') + ' toast-icon';

    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMessage').textContent = message;

    toast.classList.add('show');

    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, duration);
}

// ============================================================
// NETTOYAGE
// ============================================================
window.addEventListener('beforeunload', async () => {
    if (isScanning && qrScanner) {
        try { await qrScanner.stop(); } catch (e) {}
    }
});
</script>
